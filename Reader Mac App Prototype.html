    function openTagPicker(anchor = $("#openTagPicker")) {
      if (!selectedArticle || !anchor) return;
      const popover = $("#tagPopover");
      const windowNode = $(".window");
      renderTagPicker();
      popover.classList.add("open");
      popover.setAttribute("aria-hidden", "false");
      anchor.setAttribute("aria-expanded", "true");

      const windowRect = windowNode.getBoundingClientRect();
      const anchorRect = anchor.getBoundingClientRect();
      const margin = 12;
      let left = anchorRect.left - windowRect.left;
      let top = anchorRect.bottom - windowRect.top + 8;
      left = Math.min(Math.max(margin, left), windowRect.width - popover.offsetWidth - margin);
      if (top + popover.offsetHeight > windowRect.height - margin) {
        top = Math.max(margin, anchorRect.top - windowRect.top - popover.offsetHeight - 8);
      }
      popover.style.left = left + "px";
      popover.style.top = top + "px";
    }

    function closeTagPicker() {
      const popover = $("#tagPopover");
      popover?.classList.remove("open");
      popover?.setAttribute("aria-hidden", "true");
      $("#openTagPicker")?.setAttribute("aria-expanded", "false");
    }

    function persistTagChange(message) {
      const saved = saveState();
      renderEditorTags();
      renderTagPicker();
      renderTagFilters();
      renderList();
      setEditorSaveStatus(saved ? "已保存" : "保存失败", saved ? "saved" : "error");
      if (message) showToast(message);
    }

    function toggleTagOnArticle(name) {
      if (!selectedArticle) return;
      if (populatedEditorArticleId) {
        commitEditorDraft({ refreshList: false, silent: true });
      }
      const definition = getTagDefinition(name);
      const key = definition.name.toLocaleLowerCase();
      const tags = Array.isArray(selectedArticle.tags) ? selectedArticle.tags : [];
      const isSelected = tags.some((tag) => tag.toLocaleLowerCase() === key);
      selectedArticle.tags = isSelected
        ? tags.filter((tag) => tag.toLocaleLowerCase() !== key)
        : [...tags, definition.name];
      persistTagChange(isSelected ? "已移除标签" : "已添加标签");
    }

    function removeTagFromArticle(name) {
      if (!selectedArticle) return;
      const key = normalizeTagName(name).toLocaleLowerCase();
      selectedArticle.tags = (selectedArticle.tags || [])
        .filter((tag) => tag.toLocaleLowerCase() !== key);
      persistTagChange("已移除标签");
    }

    function createTag(event) {
      event.preventDefault();
      if (!selectedArticle) return;
      const input = $("#newTagName");
      const name = normalizeTagName(input.value);
      if (!name) {
        showToast("请输入标签名称");
        input.focus();
        return;
      }

      if (populatedEditorArticleId) {
        commitEditorDraft({ refreshList: false, silent: true });
      }
      let definition = tagCatalog.find(
        (entry) => entry.name.toLocaleLowerCase() === name.toLocaleLowerCase()
      );
      const created = !definition;
      if (!definition) {
        definition = { name, color: selectedTagColor };
        tagCatalog.push(definition);
      }
      const alreadySelected = (selectedArticle.tags || [])
        .some((tag) => tag.toLocaleLowerCase() === definition.name.toLocaleLowerCase());
      if (!alreadySelected) {
        selectedArticle.tags = [...(selectedArticle.tags || []), definition.name];
      }
      input.value = "";
      persistTagChange(created ? "新标签已创建并添加" : "已有标签已添加");
      input.focus();
    }

    function dateKeyFromDate(date) {
      const pad = (value) => String(value).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function dateFromKey(dateKey) {
      const [year, month, day] = String(dateKey).split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function isValidDateKey(dateKey) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateKey))) return false;
      const date = dateFromKey(dateKey);
      return !Number.isNaN(date.getTime()) && dateKeyFromDate(date) === dateKey;
    }

    function formatReadingDate(dateKey) {
      return new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(dateFromKey(dateKey));
    }

    function normalizeReadingStickerId(value) {
      const stickerId = Math.round(Number(value));
      return Number.isFinite(stickerId) && stickerId >= 0 && stickerId < READING_STICKER_COUNT
        ? stickerId
        : 0;
    }

    function readingStickerStyle(stickerId) {
      const normalizedId = normalizeReadingStickerId(stickerId);
      const column = normalizedId % 3;
      const row = Math.floor(normalizedId / 3);
      return `--sticker-x: ${column * 50}%; --sticker-y: ${row * (100 / 3)}%;`;
    }

    function readingStickerMarkup(stickerId, className = "") {
      return `<span class="reading-sticker ${className}" style="${readingStickerStyle(stickerId)}" aria-hidden="true"></span>`;
    }

    function normalizeBookStampIconId(value) {
      if (value === null || value === undefined || value === "") return null;
      const iconId = Math.round(Number(value));
      return Number.isFinite(iconId) && iconId >= 0 && iconId < BOOK_STAMP_ICON_COUNT
        ? iconId
        : null;
    }

    function normalizeReadingLog(log) {
      const bookTitle = String(log?.bookTitle || "").trim();
      const pages = Math.round(Number(log?.pages));
      const rawMinutes = Math.round(Number(log?.minutes));
      const minutes = Number.isFinite(rawMinutes) && rawMinutes > 0 ? Math.min(rawMinutes, 1440) : 0;
      const date = String(log?.date || "");
      const allowedStatuses = ["reading", "finished", "rereading"];
      if (!bookTitle || !isValidDateKey(date) || !Number.isFinite(pages) || pages < 1) return null;
      return {
        id: String(log.id || `reading-${Date.now()}-${Math.floor(Math.random() * 1000)}`),
        date,
        bookTitle,
        pages: Math.min(pages, 9999),
        minutes,
        stickerId: normalizeReadingStickerId(log.stickerId),
        stampIconId: normalizeBookStampIconId(log.stampIconId),
        status: allowedStatuses.includes(log.status) ? log.status : "reading",
        createdAt: Number(log.createdAt) || Date.now()
      };
    }

    function normalizeMonthlyReadingGoal(value) {
      const days = Math.round(Number(value));
      return Number.isFinite(days) ? Math.min(31, Math.max(1, days)) : 18;
    }

    function readingStatusLabel(status) {
      return { reading: "在读", finished: "读完", rereading: "重读" }[status] || "在读";
    }

    function normalizeBookStampKey(title) {
      return String(title || "")
        .normalize("NFKC")
        .trim()
        .replace(/\s+/g, " ")
        .toLocaleLowerCase();
    }

    function compareReadingCompletion(a, b) {
      return String(a.date).localeCompare(String(b.date)) || a.createdAt - b.createdAt;
    }

    function getEarnedBookStamps() {
      const latestByBook = new Map();
      readingLogs
        .filter((log) => log.status === "finished")
        .sort(compareReadingCompletion)
        .forEach((log) => latestByBook.set(normalizeBookStampKey(log.bookTitle), log));
      return Array.from(latestByBook.values()).sort((a, b) => compareReadingCompletion(b, a));
    }

    function formatBookStampDate(dateKey) {
      return String(dateKey).replaceAll("-", ".");
    }

    function bookStampIconId(title) {
      let hash = 0;
      for (const character of normalizeBookStampKey(title)) {
        hash = ((hash * 31) + character.codePointAt(0)) >>> 0;
      }
      return hash % BOOK_STAMP_ICON_COUNT;
    }

    function assignBookStampIconIds(stamps) {
      const usedIconIds = new Set();
      stamps.forEach((log) => {
        let iconId = normalizeBookStampIconId(log.stampIconId);
        if (iconId === null || (usedIconIds.has(iconId) && usedIconIds.size < BOOK_STAMP_ICON_COUNT)) {
          iconId = bookStampIconId(log.bookTitle);
          while (usedIconIds.has(iconId) && usedIconIds.size < BOOK_STAMP_ICON_COUNT) {
            iconId = (iconId + 1) % BOOK_STAMP_ICON_COUNT;
          }
          log.stampIconId = iconId;
        }
        usedIconIds.add(iconId);
      });
      return stamps;
    }

    function bookStampIconStyle(iconId) {
      const normalizedIconId = normalizeBookStampIconId(iconId) ?? 0;
      const column = normalizedIconId % 3;
      const row = Math.floor(normalizedIconId / 3);
      const clip = BOOK_STAMP_ICON_CLIPS[normalizedIconId] || "inset(0)";
      return `--stamp-icon-x: ${column * 50}%; --stamp-icon-y: ${row * 50}%; --stamp-icon-clip: ${clip};`;
    }

    function bookStampTitleSize(title) {
      const length = Array.from(String(title || "")).length;
      if (length <= 6) return 13.2;
      if (length <= 10) return 11.5;
      if (length <= 16) return 9.6;
      return 8;
    }

    function bookStampTitleFitAttributes(title) {
      return Array.from(String(title || "")).length > 16
        ? ' textLength="164" lengthAdjust="spacingAndGlyphs"'
        : "";
    }

    function bookStampStyle(index, title) {
      const palette = BOOK_STAMP_PALETTES[index % BOOK_STAMP_PALETTES.length];
      const tilt = BOOK_STAMP_TILTS[index % BOOK_STAMP_TILTS.length];
      return `--stamp-ink: ${palette.ink}; --stamp-tilt: ${tilt}; --stamp-title-size: ${bookStampTitleSize(title)}px;`;
    }

    function renderBookStamps() {
      const gallery = $("#bookStampGallery");
      const summary = $("#bookStampSummary");
      const count = $("#bookStampCount");
      if (!gallery || !summary || !count) return;
      const stamps = assignBookStampIconIds(getEarnedBookStamps());
      count.textContent = stamps.length;
      summary.textContent = stamps.length ? `已获得 ${stamps.length} 枚邮票` : "还没有获得邮票";

      if (!stamps.length) {
        gallery.innerHTML = `
          <div class="book-stamp-empty">
            <span class="glyph" data-icon="stamp"></span>
            <strong>邮票册还是空的</strong>
            <span>将一本书标记为“读完”，它的邮票会出现在这里。</span>
          </div>
        `;
        renderIcons();
        return;
      }

      gallery.innerHTML = stamps.map((log, index) => `
        <article
          class="book-stamp"
          data-book-stamp="${escapeHtml(log.id)}"
          style="${bookStampStyle(index, log.bookTitle)}"
          aria-label="${escapeHtml(log.bookTitle)}，完成于 ${escapeHtml(log.date)}"
        >
          <div class="book-stamp-art">
            <span class="book-stamp-icon" style="${bookStampIconStyle(log.stampIconId)}" aria-hidden="true"></span>
          </div>
          <svg class="book-stamp-ring" viewBox="0 0 240 240" aria-hidden="true">
            <defs>
              <path id="stamp-title-path-${index}" d="M 42 120 A 78 78 0 0 1 198 120"></path>
              <path id="stamp-date-path-${index}" d="M 54 174 A 79 79 0 0 0 186 174"></path>
            </defs>
            <circle class="book-stamp-ring-offset" cx="120" cy="120" r="103"></circle>
            <circle class="book-stamp-ring-outer" cx="120" cy="120" r="101"></circle>
            <circle class="book-stamp-ring-inner" cx="120" cy="120" r="92"></circle>
            <text class="book-stamp-ring-title">
              <textPath href="#stamp-title-path-${index}" startOffset="50%" text-anchor="middle"${bookStampTitleFitAttributes(log.bookTitle)}>${escapeHtml(log.bookTitle)}</textPath>
            </text>
            <text class="book-stamp-ring-date">
              <textPath href="#stamp-date-path-${index}" startOffset="50%" text-anchor="middle">${formatBookStampDate(log.date)}</textPath>
            </text>
          </svg>
        </article>
      `).join("");
    }

    function openBookStampAlbum() {
      renderBookStamps();
      $("#bookStampOverlay").classList.add("open");
    }

    function getFolderName(folderId) {
      return folders.find((folder) => folder.id === folderId)?.name || "研究材料";
    }

    function getFolderIdByName(name) {
      return folders.find((folder) => folder.name === name)?.id || "research";
    }

    function hydrateArticle(article) {
      const folderId = article.folderId || getFolderIdByName(article.folder);
      const wasSubscription = article.type === "rss" || article.source === "RSS";
      const isLegacyTextSource = wasSubscription || ["url", "video"].includes(article.type);
      const isImage = article.type === "image";
      const usesUnifiedEditor = Number(article.contentSchemaVersion) >= 1;
      const normalizedTags = (article.tags || []).filter((tag) => {
        const key = String(tag).toLowerCase();
        if (wasSubscription && ["rss", "subscription"].includes(key)) return false;
        if (article.type === "video" && key === "video") return false;
        return true;
      });
      const markedText = Array.isArray(article.highlightedText)
        ? article.highlightedText.map((item) => item.text || item).filter(Boolean).join("\n").trim()
        : "";
      const draftMarkedText = Array.isArray(article.highlightedDraft)
        ? article.highlightedDraft.map((item) => item.text || item).filter(Boolean).join("\n").trim()
        : "";
      const recognizedText = isImage ? markedText || String(article.ocrText || "").trim() : article.ocrText;
      const draftRecognizedText = isImage
        ? draftMarkedText || String(article.ocrDraftText ?? recognizedText ?? "").trim()
        : article.ocrDraftText;
      const rawBody = Array.isArray(article.body)
        ? article.body.map((paragraph) => String(paragraph || "").trim()).filter(Boolean)
        : [];
      const legacyImageBody = /已导入 Reader 原型|本次导入只保存在|真实应用中会把文件|##\s*(划线文字|OCR 全文|资料说明)/i
        .test(rawBody.join("\n"));
      const imageBody = rawBody.length && (usesUnifiedEditor || !legacyImageBody)
        ? rawBody
        : recognizedText
          ? recognizedText.split(/\n{2,}/).map((paragraph) => paragraph.trim()).filter(Boolean)
          : [];
      const imageTags = usesUnifiedEditor
        ? normalizedTags
        : normalizedTags.filter((tag) => !["image", "attachment"].includes(String(tag).toLowerCase()));
      const imageSummaryText = imageBody.join(" ").replace(/\s+/g, " ").trim();
      const legacyErrorIsOcr = article.aiError && /(OCR|Tesseract|画线|图片|识别)/i.test(article.aiError);
      const migratedOcrError = article.ocrError || (legacyErrorIsOcr ? article.aiError : "");
      const legacyOcrStatus = ["ocr", "extracting"].includes(article.aiStatus)
        ? article.aiStatus
        : migratedOcrError ? "error" : article.ocrText || article.highlightedText?.length ? "done" : "idle";
      const ocrConfirmed = typeof article.ocrConfirmed === "boolean"
        ? article.ocrConfirmed
        : Boolean(article.ocrText || article.highlightedText?.length);
      return {
        later: false,
        aiProcessed: false,
        aiStatus: "idle",
        aiError: "",
        ocrStatus: "idle",
        ocrError: "",
        ocrText: "",
        highlightedText: [],
        ocrDraftText: null,
        highlightedDraft: null,
        ocrConfirmed: false,
        aiSummary: null,
        aiTranslations: [],
        aiRewrites: [],
        aiLinks: null,
        ocrConfidence: null,
        ...article,
        aiStatus: legacyErrorIsOcr && article.aiStatus === "error" ? "idle" : article.aiStatus || "idle",
        aiError: legacyErrorIsOcr ? "" : article.aiError || "",
        ocrStatus: migratedOcrError ? "error" : article.ocrStatus || legacyOcrStatus,
        ocrError: migratedOcrError,
        ocrConfirmed,
        ocrText: isImage ? recognizedText : article.ocrText || "",
        highlightedText: isImage ? [] : article.highlightedText || [],
        ocrDraftText: isImage ? draftRecognizedText : (article.ocrDraftText ?? null),
        highlightedDraft: isImage ? [] : (article.highlightedDraft ?? null),
        type: isLegacyTextSource ? "markdown" : article.type,
        source: isLegacyTextSource ? "Article" : article.type === "markdown" && article.source === "Markdown" ? "Article" : article.source,
        contentSchemaVersion: 2,
        tags: isImage ? imageTags : normalizedTags,
        body: isImage ? imageBody : rawBody,
        summary: isImage ? (imageSummaryText || "等待文字识别").slice(0, 140) : article.summary || "",
        folderId,
        folder: getFolderName(folderId)
      };
    }

    function normalizeFilter(filter) {
      if (["ai", "ocr", "later", "rss", "social"].includes(filter)) return "inbox";
      if (["research", "ai-society", "methods", "writing"].includes(filter)) {
        return `folder:${filter}`;
      }
      return filter || "folder:research";
    }

    function loadState() {
      folders = cloneData(defaultFolders);
      articles = cloneData(defaultArticles).map(hydrateArticle);
      collapsedFolderIds = new Set();
      tagCatalog = cloneData(defaultTagCatalog);
      selectedArticle = articles[0] || null;
      readingLogs = [];
      monthlyReadingGoal = 18;
      selectedReadingDate = dateKeyFromDate(new Date());
      calendarCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          ensureTagCatalog();
          return;
        }
        const saved = JSON.parse(raw);
        if (Array.isArray(saved.folders) && saved.folders.length) {
          folders = saved.folders;
        }
        if (Array.isArray(saved.articles) && saved.articles.length) {
          articles = saved.articles.map(hydrateArticle);
        }
        collapsedFolderIds = new Set(
          Array.isArray(saved.collapsedFolderIds)
            ? saved.collapsedFolderIds.filter((folderId) => folders.some((folder) => folder.id === folderId))
            : []
        );
        if (Array.isArray(saved.tagCatalog)) {
          tagCatalog = saved.tagCatalog;
        }
        ensureTagCatalog();
        selectedArticle = articles.find((article) => article.id === saved.selectedArticleId) || articles[0] || null;
        currentFilter = normalizeFilter(saved.currentFilter);
        currentTagFilters = Array.isArray(saved.currentTagFilters)
          ? Array.from(new Set(saved.currentTagFilters.map(normalizeTagName).filter(Boolean)))
          : [];
        readingLogs = Array.isArray(saved.readingLogs)
          ? saved.readingLogs.map(normalizeReadingLog).filter(Boolean)
          : [];
        monthlyReadingGoal = normalizeMonthlyReadingGoal(saved.monthlyReadingGoal);
        selectedReadingDate = isValidDateKey(saved.selectedReadingDate)
          ? saved.selectedReadingDate
          : dateKeyFromDate(new Date());
        const selectedDate = dateFromKey(selectedReadingDate);
        calendarCursor = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
      } catch (_error) {
        folders = cloneData(defaultFolders);
        articles = cloneData(defaultArticles).map(hydrateArticle);
        collapsedFolderIds = new Set();
        tagCatalog = cloneData(defaultTagCatalog);
        ensureTagCatalog();
        selectedArticle = articles[0] || null;
        readingLogs = [];
        monthlyReadingGoal = 18;
        selectedReadingDate = dateKeyFromDate(new Date());
        calendarCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      }
    }

    function saveState() {
      ensureTagCatalog();
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            folders,
            articles,
            collapsedFolderIds: Array.from(collapsedFolderIds),
            tagCatalog,
            selectedArticleId: selectedArticle?.id || null,
            currentFilter,
            currentTagFilters,
            readingLogs,
            selectedReadingDate,
            monthlyReadingGoal
          })
        );
        return true;
      } catch (_error) {
        showToast("浏览器阻止了本地保存");
        return false;
      }
    }

    function resetDemoState() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_error) {
        // Ignore storage reset failures in the prototype.
      }
      folders = cloneData(defaultFolders);
      articles = cloneData(defaultArticles).map(hydrateArticle);
      collapsedFolderIds = new Set();
      tagCatalog = cloneData(defaultTagCatalog);
      ensureTagCatalog();
      selectedArticle = articles[0] || null;
      currentFilter = "folder:research";
      currentTagFilters = [];
      readingLogs = [];
      monthlyReadingGoal = 18;
      selectedReadingDate = dateKeyFromDate(new Date());
      calendarCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      renderAll();
      showToast("已重置示例数据");
    }

    function makeFolderId(name) {
      const base = name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
        .replace(/^-|-$/g, "") || "folder";
      let id = base;
      let index = 2;
      while (folders.some((folder) => folder.id === id)) {
        id = `${base}-${index}`;
        index += 1;
      }
      return id;
    }

    function getFolderDescendantIds(folderId) {
      const ids = new Set([folderId]);
      let changed = true;
      while (changed) {
        changed = false;
        folders.forEach((folder) => {
          if (folder.parentId && ids.has(folder.parentId) && !ids.has(folder.id)) {
            ids.add(folder.id);
            changed = true;
          }
        });
      }
      return ids;
    }

    function getArticleCountForFilter(filter) {
      return articles.filter((article) => {
        if (filter === "inbox") return true;
        if (filter === "favorite") return article.favorite;
        return true;
      }).length;
    }

    function getArticleCountForFolder(folderId) {
      const ids = getFolderDescendantIds(folderId);
      return articles.filter((article) => ids.has(article.folderId)).length;
    }

    function getDefaultImportFolderId() {
      if (currentFilter.startsWith("folder:")) {
        return currentFilter.replace("folder:", "");
      }
      return "research";
    }

    function updateCounts() {
      ["inbox", "favorite"].forEach((filter) => {
        const node = $(`.nav-item[data-filter="${filter}"] .count`);
        if (node) node.textContent = getArticleCountForFilter(filter);
      });
      const stampCount = $("#bookStampCount");
      if (stampCount) stampCount.textContent = getEarnedBookStamps().length;
      $("#storageSummary").textContent = `${articles.length} items stored on this Mac`;
    }

    function selectNearestArticle(preferredFolderId = null) {
      if (preferredFolderId) {
        const ids = getFolderDescendantIds(preferredFolderId);
        selectedArticle = articles.find((article) => ids.has(article.folderId)) || articles[0] || null;
      } else {
        selectedArticle = articles[0] || null;
      }
    }

    function renderEmptyReader() {
      populatedEditorArticleId = null;
      savedEditorRange = null;
      $("#editTitle").value = "";
      $("#editorTagList").innerHTML = "";
      $("#openTagPicker").disabled = true;
      closeTagPicker();
      $("#editText").innerHTML = "";
      $("#editOcrWorkflow").hidden = true;
      $("#editExtractMarkedText").hidden = true;
      $("#saveArticleButton").disabled = true;
      setEditorSaveStatus("没有选中的条目");
      $("#favoriteButton").style.background = "transparent";
    }

    function deleteArticle(articleId = selectedArticle?.id) {
      if (!articleId) return;
      const removed = articles.find((article) => article.id === articleId);
      articles = articles.filter((article) => article.id !== articleId);
      if (selectedArticle?.id === articleId) {
        selectNearestArticle(removed?.folderId || null);
      }
      closeArticleMenu();
      saveState();
      renderAll();
      showToast("已删除条目");
    }

    function renameFolder(folderId, name) {
      const folder = folders.find((item) => item.id === folderId);
      const cleanName = String(name || "").trim();
      if (!folder || !cleanName) {
        showToast("请输入文件夹名称");
        return false;
      }
      const duplicate = folders.some((item) => item.id !== folderId
        && item.parentId === folder.parentId
        && item.name === cleanName);
      if (duplicate) {
        showToast("同级目录里已有这个名称");
        return false;
      }
      folder.name = cleanName;
      articles.forEach((article) => {
        if (article.folderId === folderId) article.folder = cleanName;
      });
      saveState();
      renderAll();
      $("#folderOverlay").classList.remove("open");
      folderEditingId = null;
      showToast("文件夹已重命名");
      return true;
    }

    function deleteFolder(folderId) {
      if (!folderId) return;
      const ids = getFolderDescendantIds(folderId);
      const removedCount = articles.filter((article) => ids.has(article.folderId)).length;
      folders = folders.filter((folder) => !ids.has(folder.id));
      articles = articles.filter((article) => !ids.has(article.folderId));
      ids.forEach((id) => collapsedFolderIds.delete(id));
      if (selectedArticle && ids.has(selectedArticle.folderId)) {
        selectNearestArticle();
      }
      if (currentFilter.startsWith("folder:") && ids.has(currentFilter.replace("folder:", ""))) {
        currentFilter = "inbox";
      }
      closeFolderMenu();
      saveState();
      renderAll();
      showToast(removedCount ? `已删除文件夹和 ${removedCount} 个条目` : "已删除文件夹");
    }

    function validateFolderMove(folderId, parentId) {
      const folder = folders.find((item) => item.id === folderId);
      if (!folder) return { ok: false, message: "找不到这个文件夹" };
      if ((folder.parentId || null) === (parentId || null)) {
        return { ok: false, message: parentId ? "已经位于这个目录中" : "已经是一级目录" };
      }
      if (!parentId) return { ok: true };
      const parent = folders.find((item) => item.id === parentId);
      if (!parent) return { ok: false, message: "目标目录不存在" };
      if (parent.id === folderId || getFolderDescendantIds(folderId).has(parent.id)) {
        return { ok: false, message: "不能把文件夹移到自身内部" };
      }
      if (parent.parentId) {
        return { ok: false, message: "目前只支持一级和二级目录" };
      }
      const hasChildren = folders.some((item) => item.parentId === folderId);
      if (hasChildren) {
        return { ok: false, message: "含有子文件夹的目录需保留在一级" };
      }
      return { ok: true };
    }

    function moveFolderToParent(folderId, parentId) {
      const validation = validateFolderMove(folderId, parentId);
      if (!validation.ok) {
        showToast(validation.message);
        return false;
      }
      const folder = folders.find((item) => item.id === folderId);
      folder.parentId = parentId || null;
      if (currentFilter.startsWith("folder:") && selectedArticle && !matchesLibraryFilter(selectedArticle)) {
        selectedArticle = articles.find(matchesLibraryFilter) || null;
      }
      saveState();
      renderAll();
      showToast(parentId ? `已移入「${getFolderName(parentId)}」` : "已移至一级目录");
      return true;
    }

    function moveArticleToFolder(articleId, folderId) {
      const article = articles.find((item) => item.id === articleId);
      const folder = folders.find((item) => item.id === folderId);
      if (!article || !folder) return false;
      if (article.folderId === folderId) {
        showToast("条目已经在这个目录中");
        return false;
      }
      if (selectedArticle?.id === articleId && populatedEditorArticleId) {
        commitEditorDraft({ refreshList: false, silent: true });
      }
      article.folderId = folderId;
      article.folder = folder.name;
      if (currentFilter.startsWith("folder:") && !matchesLibraryFilter(article)) {
        selectedArticle = articles.find(matchesLibraryFilter) || null;
      }
      saveState();
      renderAll();
      showToast(`已移入「${folder.name}」`);
      return true;
    }

    function clearLibraryDropIndicators() {
      $$(".tree-row.folder-drop-target, .tree-row.folder-drop-invalid").forEach((row) => {
        row.classList.remove("folder-drop-target", "folder-drop-invalid");
      });
      $("#folderRootDropZone")?.classList.remove("folder-root-drop-target");
    }

    function beginLibraryDrag(payload, node, event) {
      libraryDragPayload = payload;
      node.classList.add("dragging");
      node.setAttribute("aria-grabbed", "true");
      document.body.classList.add("library-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", `${payload.type}:${payload.id}`);
    }

    function finishLibraryDrag(node = null) {
      node?.classList.remove("dragging");
      node?.setAttribute("aria-grabbed", "false");
      document.body.classList.remove("library-dragging");
      clearLibraryDropIndicators();
      libraryDragPayload = null;
    }

    function renderFolders() {
      const tree = $("#folderTree");
      const renderLevel = (parentId, level) => folders
        .filter((folder) => folder.parentId === parentId)
        .map((folder) => {
          const filter = `folder:${folder.id}`;
          const selected = currentFilter === filter ? "active" : "";
          const childFolders = folders.filter((child) => child.parentId === folder.id);
          const directArticles = articles.filter((article) => article.folderId === folder.id);
          const leafArticles = childFolders.length
            ? []
            : directArticles;
          const hasBranch = childFolders.length > 0 || leafArticles.length > 0;
          const isCollapsed = hasBranch && collapsedFolderIds.has(folder.id);
          const disclosure = hasBranch
            ? `
              <span class="tree-disclosure ${isCollapsed ? "" : "is-open"}" aria-hidden="true">
                <span class="glyph" data-icon="chevron-right"></span>
              </span>
            `
            : '<span class="tree-disclosure is-placeholder" aria-hidden="true"></span>';
          const articleNodes = leafArticles.length && !isCollapsed
            ? `
              <div class="folder-article-list tree-level-${level + 1}" data-parent-folder-id="${folder.id}">
                ${leafArticles.map((article) => `
                  <button
                    class="folder-article-item ${article.id === selectedArticle?.id ? "active" : ""}"
                    type="button"
                    data-folder-article-id="${article.id}"
                    title="${escapeHtml(article.title)}"
                    aria-current="${article.id === selectedArticle?.id ? "page" : "false"}"
                  >
                    <span class="glyph" data-icon="file"></span>
                    <span class="folder-article-title">${escapeHtml(article.title)}</span>
                    ${article.favorite ? '<span class="folder-article-favorite" aria-label="已收藏">★</span>' : ""}
                  </button>
                `).join("")}
              </div>
            `
            : "";
          const childNodes = isCollapsed ? "" : renderLevel(folder.id, level + 1);
          return `
            <div class="tree-row tree-level-${level}" data-folder-id="${folder.id}" data-level="${level}" draggable="true" aria-grabbed="false" title="拖动以调整目录">
              <button class="tree-item ${selected}" data-filter="${filter}" data-folder-id="${folder.id}" data-collapsible="${hasBranch}" aria-expanded="${hasBranch ? String(!isCollapsed) : "false"}" draggable="false">
                ${disclosure}
                <span class="glyph" data-icon="folder"></span>
                <span class="nav-text">${escapeHtml(folder.name)}</span>
                <span class="count">${getArticleCountForFolder(folder.id)}</span>
              </button>
              <button class="tree-more" data-folder-menu="${folder.id}" title="文件夹选项">•••</button>
            </div>
            ${articleNodes}
            ${childNodes}
          `;
        })
        .join("");

      tree.innerHTML = renderLevel(null, 0);
      renderIcons();
      wireFolderTreeEvents();
    }

    function getReadingLogsForDate(dateKey) {
      return readingLogs
        .filter((log) => log.date === dateKey)
        .sort((a, b) => b.createdAt - a.createdAt);
    }

    function reuseReadingStickerForBookTitle() {
      const normalizedTitle = $("#readingBookInput").value.trim().toLocaleLowerCase();
      if (!normalizedTitle) return;
      const previousLog = [...readingLogs]
        .reverse()
        .find((log) => log.bookTitle.trim().toLocaleLowerCase() === normalizedTitle);
      if (!previousLog) return;
      selectedReadingStickerId = normalizeReadingStickerId(previousLog.stickerId);

    }

    function renderReadingStats() {
      const displayedYear = calendarCursor.getFullYear();
      const displayedMonth = calendarCursor.getMonth();
      const monthlyDays = new Set(
        readingLogs
          .filter((log) => {
            const date = dateFromKey(log.date);
            return date.getFullYear() === displayedYear && date.getMonth() === displayedMonth;
          })
          .map((log) => log.date)
      ).size;
      const totalDays = new Set(readingLogs.map((log) => log.date)).size;
      const todayKey = dateKeyFromDate(new Date());
      const todayMinutes = getReadingLogsForDate(todayKey)
        .reduce((sum, log) => sum + (Number(log.minutes) || 0), 0);
      const progress = Math.round((monthlyDays / monthlyReadingGoal) * 100);

      $("#monthlyReadingDays").textContent = monthlyDays;
      $("#totalReadingDays").textContent = totalDays;
      $("#todayReadingMinutes").textContent = todayMinutes;
      $("#readingGoalProgress").textContent = progress;
      $("#readingGoalBar").style.width = `${Math.min(progress, 100)}%`;
      $("#openReadingGoal").setAttribute(
        "aria-label",
        `本月已阅读 ${monthlyDays} 天，每月目标 ${monthlyReadingGoal} 天，完成 ${progress}%，点击设置目标`
      );
    }

    function renderReadingCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      const firstDay = new Date(year, month, 1);
      const leadingBlanks = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayKey = dateKeyFromDate(new Date());
      const cells = [];

      $("#calendarMonthLabel").textContent = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long"
      }).format(firstDay);

      for (let index = 0; index < leadingBlanks; index += 1) {
        cells.push('<span class="calendar-blank" aria-hidden="true"></span>');
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateKey = dateKeyFromDate(new Date(year, month, day));
        const logs = getReadingLogsForDate(dateKey);
        const classes = [
          "calendar-day",
          dateKey === selectedReadingDate ? "selected" : "",
          dateKey === todayKey ? "today" : "",
          logs.length ? "has-log" : ""
        ].filter(Boolean).join(" ");
        const content = logs.length
          ? `
              <span class="calendar-date-corner">${day}</span>
              ${readingStickerMarkup(logs[0].stickerId, "calendar-reading-sticker")}
              ${logs.length > 1 ? `<span class="calendar-log-count">${logs.length}</span>` : ""}
            `
          : `<span>${day}</span>`;
        cells.push(`
          <button
            class="${classes}"
            data-reading-date="${dateKey}"
            aria-label="${escapeHtml(formatReadingDate(dateKey))}${logs.length ? `，${logs.length} 条阅读记录` : ""}"
            aria-pressed="${dateKey === selectedReadingDate}"
          >${content}</button>
        `);
      }

      $("#readingCalendar").innerHTML = cells.join("");
      renderIcons();
      $$("#readingCalendar [data-reading-date]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedReadingDate = button.dataset.readingDate;
          saveState();
          renderReadingCheckin();
        });
      });
    }

    function renderReadingLogList() {
      const logs = getReadingLogsForDate(selectedReadingDate);
      const totalPages = logs.reduce((sum, log) => sum + log.pages, 0);
      const totalMinutes = logs.reduce((sum, log) => sum + (Number(log.minutes) || 0), 0);
      $("#selectedReadingDateLabel").textContent = formatReadingDate(selectedReadingDate);
      $("#selectedReadingCount").textContent = logs.length ? `${logs.length} 条阅读记录` : "还没有打卡";
      $("#selectedReadingPages").textContent = totalMinutes
        ? `${totalPages} 页 · ${totalMinutes} 分钟`
        : `${totalPages} 页`;

      if (!logs.length) {
        $("#readingLogList").innerHTML = `
          <div class="reading-log-empty">
            <span class="glyph" data-icon="book"></span>
            选择右上角的加号，记录这一天读过的书。
          </div>
        `;
        renderIcons();
        return;
      }

      $("#readingLogList").innerHTML = logs.map((log) => `
        <div class="reading-log-row">
          <div class="reading-log-mark">
            ${readingStickerMarkup(log.stickerId, "log-reading-sticker")}
          </div>
          <div class="reading-log-copy">
            <div class="reading-log-title" title="${escapeHtml(log.bookTitle)}">${escapeHtml(log.bookTitle)}</div>
            <div class="reading-log-meta">
              <span class="reading-status ${log.status}">${readingStatusLabel(log.status)}</span>
              <span>${log.pages} 页</span>
              ${log.minutes ? `<span>${log.minutes} 分钟</span>` : ""}
            </div>
          </div>
          <div class="reading-log-actions">
            <button class="reading-log-action reading-log-edit" type="button" data-edit-reading-log="${escapeHtml(log.id)}" title="编辑这条打卡" aria-label="编辑 ${escapeHtml(log.bookTitle)} 的阅读记录">
              <span class="glyph" data-icon="pencil"></span>
            </button>
            <button class="reading-log-action reading-log-delete" type="button" data-delete-reading-log="${escapeHtml(log.id)}" title="删除这条打卡" aria-label="删除 ${escapeHtml(log.bookTitle)} 的阅读记录">
              <span class="glyph" data-icon="trash"></span>
            </button>
          </div>
        </div>
      `).join("");
      renderIcons();
      $$('[data-edit-reading-log]').forEach((button) => {
        button.addEventListener("click", () => openReadingCheckinModal(button.dataset.editReadingLog));
      });
      $$('[data-delete-reading-log]').forEach((button) => {
        button.addEventListener("click", () => deleteReadingLog(button.dataset.deleteReadingLog));
      });

    function renderReadingCheckin() {
      renderReadingCalendar();
      renderReadingStats();
      renderReadingLogList();
      renderBookStamps();
    }

    function shiftCalendarMonth(offset) {
      const selectedDay = dateFromKey(selectedReadingDate).getDate();
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth() + offset;
      const targetMonth = new Date(year, month, 1);
      const targetDay = Math.min(selectedDay, new Date(targetMonth.getFullYear(), targetMonth.getMonth() + 1, 0).getDate());
      calendarCursor = targetMonth;
      selectedReadingDate = dateKeyFromDate(new Date(targetMonth.getFullYear(), targetMonth.getMonth(), targetDay));
      saveState();
      renderReadingCheckin();
    }

    function openReadingCheckinModal(logId = null) {
      const targetId = typeof logId === "string" ? logId : null;
      const log = targetId ? readingLogs.find((entry) => entry.id === targetId) : null;
      editingReadingLogId = log?.id || null;
      $("#readingLogModalTitle").textContent = log ? "编辑阅读记录" : "添加阅读打卡";
      $("#readingLogSubmitButton").textContent = log ? "保存修改" : "完成打卡";
      $("#readingDateInput").value = log?.date || selectedReadingDate;
      $("#readingBookInput").value = log?.bookTitle || "";
      $("#readingPagesInput").value = log?.pages || "";
      $("#readingMinutesInput").value = log?.minutes || "";
      $("#readingStatusSelect").value = log?.status || "reading";
      selectedReadingStickerId = normalizeReadingStickerId(log?.stickerId || 0);
      renderReadingStickerPicker();
      $("#readingLogOverlay").classList.add("open");
      window.setTimeout(() => $("#readingBookInput").focus(), 40);
    }

    function saveReadingLog(event) {
      event.preventDefault();
      const existingIndex = editingReadingLogId
        ? readingLogs.findIndex((entry) => entry.id === editingReadingLogId)
        : -1;
      const existingLog = existingIndex >= 0 ? readingLogs[existingIndex] : null;
      const log = normalizeReadingLog({
        id: existingLog?.id || `reading-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        date: $("#readingDateInput").value,
        bookTitle: $("#readingBookInput").value,
        pages: $("#readingPagesInput").value,
        minutes: $("#readingMinutesInput").value,
        stickerId: selectedReadingStickerId,
        stampIconId: existingLog?.stampIconId,
        status: $("#readingStatusSelect").value,
        createdAt: existingLog?.createdAt || Date.now()
      });
      if (!log || log.minutes < 1) {
        showToast("请填写日期、书名、页数和阅读时长");
        return;
      }
      const newBookKey = normalizeBookStampKey(log.bookTitle);
      const keptExistingStamp = existingLog?.status === "finished"
        && normalizeBookStampKey(existingLog.bookTitle) === newBookKey;
      const hadOtherFinishedStamp = readingLogs.some(
        (entry) => entry.id !== existingLog?.id
          && entry.status === "finished"
          && normalizeBookStampKey(entry.bookTitle) === newBookKey
      );
      const earnedNewStamp = log.status === "finished" && !keptExistingStamp && !hadOtherFinishedStamp;
      if (existingIndex >= 0) {
        readingLogs.splice(existingIndex, 1, log);
      } else {
        readingLogs.push(log);
      }
      assignBookStampIconIds(getEarnedBookStamps());
      selectedReadingDate = log.date;
      const savedDate = dateFromKey(log.date);
      calendarCursor = new Date(savedDate.getFullYear(), savedDate.getMonth(), 1);
      saveState();
      editingReadingLogId = null;
      $("#readingLogOverlay").classList.remove("open");
      renderReadingCheckin();
      if (earnedNewStamp) {
        showToast(`已读完《${log.bookTitle}》，获得一枚书籍邮票`);
      } else if (existingLog) {
        showToast("阅读记录已保存");
      } else if (log.status === "finished") {
        showToast(`已更新《${log.bookTitle}》的完成邮票`);
      } else {
        showToast(`已完成 ${log.minutes} 分钟 · ${log.pages} 页阅读打卡`);
      }
    }

    function openReadingGoalModal() {
      $("#readingGoalDaysInput").value = monthlyReadingGoal;
      $("#readingGoalOverlay").classList.add("open");
      window.setTimeout(() => {
        $("#readingGoalDaysInput").focus();
        $("#readingGoalDaysInput").select();
      }, 40);
    }

    function saveReadingGoal(event) {
      event.preventDefault();
      monthlyReadingGoal = normalizeMonthlyReadingGoal($("#readingGoalDaysInput").value);
      saveState();
      $("#readingGoalOverlay").classList.remove("open");
      renderReadingStats();
      showToast(`每月阅读目标已设为 ${monthlyReadingGoal} 天`);
    }

    function deleteReadingLog(logId) {
      const before = readingLogs.length;
      readingLogs = readingLogs.filter((log) => log.id !== logId);
      if (readingLogs.length === before) return;
      saveState();
      renderReadingCheckin();
      showToast("已删除阅读打卡");
    }

    function renderAll() {
      renderIcons();
      renderFolders();
      updateCounts();
      const activeLabel = currentFilter.startsWith("folder:")
        ? getFolderName(currentFilter.replace("folder:", ""))
        : $(`.nav-item[data-filter="${currentFilter}"] .nav-text`)?.textContent || "档案袋";
      setActiveLibrary(currentFilter, activeLabel);
      renderTagFilters();
      renderList();
      if (selectedArticle) {
        renderArticle();
      } else {
        renderEmptyReader();
      }
      renderReadingCheckin();
    }

    function typeLabel(type) {
      return { pdf: "PDF", image: "图片", markdown: "文章" }[type] || "附件";
    }

    function fileTypeFromMime(file) {
      if (file.type.startsWith("image/")) return "image";
      if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) return "pdf";
      return null;
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 KB";
      const units = ["B", "KB", "MB", "GB"];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    }

    function matchesLibraryFilter(article) {
      if (currentFilter.startsWith("folder:")) {
        const folderId = currentFilter.replace("folder:", "");
        return getFolderDescendantIds(folderId).has(article.folderId);
      }
      if (currentFilter === "favorite") return article.favorite;
      return true;
    }

    function setActiveLibrary(filter, label) {
      if (currentFilter !== filter) tagFiltersExpanded = false;
      currentFilter = filter;
      $$(".nav-item, .tree-item").forEach((node) => node.classList.toggle("active", node.dataset.filter === filter));
      $("#listTitle").textContent = label;
    }

    function addMockArticle(item) {
      const folderId = item.folderId || getDefaultImportFolderId();
      const article = {
        id: `${item.type || "item"}-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        type: item.type || "markdown",
        source: item.source || typeLabel(item.type || "markdown"),
        time: "刚刚",
        folderId,
        folder: getFolderName(folderId),
        favorite: false,
        later: false,
        aiProcessed: item.aiProcessed || false,
        aiStatus: item.aiStatus || "idle",
        aiError: item.aiError || "",
        ocrStatus: item.ocrStatus || (["ocr", "extracting"].includes(item.aiStatus) ? item.aiStatus : "idle"),
        ocrError: item.ocrError || "",
        ocrText: item.ocrText || "",
        highlightedText: item.highlightedText || [],
        ocrDraftText: item.ocrDraftText ?? null,
        highlightedDraft: item.highlightedDraft ?? null,
        ocrConfirmed: item.ocrConfirmed ?? (item.type === "image" ? false : Boolean(item.ocrText || item.highlightedText?.length)),
        aiSummary: item.aiSummary || null,
        aiTranslations: item.aiTranslations || [],
        aiRewrites: item.aiRewrites || [],
        aiLinks: item.aiLinks || null,
        ocrConfidence: item.ocrConfidence || null,
        contentSchemaVersion: 2,
        title: item.title || "Untitled item",
        summary: item.summary || "新内容已添加到本地资料库。",
        tags: item.tags || ["imported"],
        minutes: item.minutes || 4,
        body: item.body || [
          "这是一个原型级导入结果。Reader 会在真实应用中保存原始文件、元数据、标签和编辑记录。",
          "当前版本不会把文件写入磁盘；它只在本次浏览器会话里展示导入后的资料卡。"
        ],
        previewUrl: item.previewUrl || null,
        fileName: item.fileName || null
      };
      articles.unshift(article);
      selectedArticle = article;
      currentTagFilters = [];
      setActiveLibrary(`folder:${folderId}`, getFolderName(folderId));
      saveState();
      renderAll();
      showToast("已添加到本地资料库");
      return article;
    }

    function selectArticleById(articleId, { revealFolder = false } = {}) {
      const hasActiveDraft = Boolean(populatedEditorArticleId);
      if (hasActiveDraft && !commitEditorDraft({ refreshList: false, silent: true })) {
        setEditorSaveStatus("保存失败", "error");
        showToast("当前文章未能保存，暂未切换");
        return false;
      }

      const article = articles.find((item) => item.id === articleId);
      if (!article) return false;
      selectedArticle = article;
      if (revealFolder) {
        currentTagFilters = [];
        setActiveLibrary(`folder:${article.folderId}`, getFolderName(article.folderId));
      }
      saveState();
      renderFolders();
      if (revealFolder) renderTagFilters();
      renderList();
      renderArticle();
      showToast("已切换文章");
      return true;
    }

    function renderList() {
      const query = $("#librarySearch").value.trim().toLowerCase();
      const filtered = articles.filter((article) => {
        const articleTagKeys = new Set((article.tags || []).map((tag) => tag.toLocaleLowerCase()));
        const tagMatch = currentTagFilters.every((tag) => articleTagKeys.has(tag.toLocaleLowerCase()));
        const text = [article.title, article.summary, article.folder, ...article.tags].join(" ").toLowerCase();
        return tagMatch && matchesLibraryFilter(article) && text.includes(query);
      });
      if (!filtered.length) {
        $("#articleList").innerHTML = `
          <div class="empty-state">
            <strong>没有匹配内容</strong>
            <span>换一个目录、标签或搜索词，或者从左上角添加新资料。</span>
          </div>
        `;
        return;
      }
      $("#articleList").innerHTML = filtered.map((article) => `
        <div class="article-card ${article.id === selectedArticle?.id ? "active" : ""}" data-article-id="${article.id}" role="button" tabindex="0" draggable="true" aria-grabbed="false" title="拖到左侧文件夹可移动目录">
          <button class="article-more" data-article-menu="${article.id}" title="条目选项">•••</button>
          <h3 class="card-title">${article.favorite ? "★ " : ""}${escapeHtml(article.title)}</h3>

        button.addEventListener("click", (event) => {

          const rect = button.getBoundingClientRect();

    function getMarkedText(article) {
      return Array.isArray(article.highlightedText)
        ? article.highlightedText.map((item) => item.text || item).filter(Boolean).join("\n")
        : "";
    }

    function getDraftMarkedText(article) {
      if (Array.isArray(article.highlightedDraft)) {
        return article.highlightedDraft.map((item) => item.text || item).filter(Boolean).join("\n");
      }
      return getMarkedText(article);
    }

    function getRecognizedText(article) {
      const markedText = getMarkedText(article).trim();
      return markedText || String(article.ocrText || "").trim();
    }

    function getDraftRecognizedText(article) {
      const markedText = getDraftMarkedText(article).trim();
      const ocrText = typeof article.ocrDraftText === "string"
        ? article.ocrDraftText.trim()
        : String(article.ocrText || "").trim();
      return markedText || ocrText || getRecognizedText(article);
    }

    function plainTextToEditorHtml(text) {
      const normalized = String(text || "").replace(/\r\n/g, "\n").trim();
      if (!normalized) return "";
      return normalized
        .split(/\n{2,}/)
        .map((paragraph) => "<p>" + escapeHtml(paragraph).replace(/\n/g, "<br>") + "</p>")
        .join("");
    }

    function sanitizeRichText(htmlValue) {
      const template = document.createElement("template");
      template.innerHTML = String(htmlValue || "");
      const allowedTags = new Set([
        "P", "DIV", "BR", "STRONG", "B", "EM", "I", "U", "S", "UL", "OL", "LI",
        "BLOCKQUOTE", "H1", "H2", "H3", "A", "SPAN", "FIGURE", "IMG"
      ]);
      Array.from(template.content.querySelectorAll("*")).forEach((node) => {
        if (!allowedTags.has(node.tagName)) {
          node.replaceWith(...Array.from(node.childNodes));
          return;
        }

        if (node.tagName === "IMG") {
          const imageSource = String(node.getAttribute("src") || "");
          const altText = String(node.getAttribute("alt") || "").slice(0, 180);
          if (!/^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(imageSource)) {
            node.remove();
            return;
          }
          Array.from(node.attributes).forEach((attribute) => node.removeAttribute(attribute.name));
          node.setAttribute("src", imageSource);
          node.setAttribute("alt", altText);
          node.setAttribute("loading", "lazy");
          node.setAttribute("draggable", "false");
          return;
        }

        if (node.tagName === "SPAN") {
          const fontSize = Math.round(Number.parseFloat(node.style.fontSize));
          Array.from(node.attributes).forEach((attribute) => node.removeAttribute(attribute.name));
          if (!Number.isFinite(fontSize) || fontSize < 12 || fontSize > 48) {
            node.replaceWith(...Array.from(node.childNodes));
            return;
          }
          node.setAttribute("style", `font-size: ${fontSize}px;`);
          return;
        }

        Array.from(node.attributes).forEach((attribute) => {
          const keepHref = node.tagName === "A"
            && attribute.name === "href"
            && /^(https?:|mailto:|#)/i.test(attribute.value);
          if (!keepHref) node.removeAttribute(attribute.name);
        });
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noreferrer");
        }
      });
      return template.innerHTML;
    }

    function getEditorHtml(article) {
      if (article.bodyHtml) return sanitizeRichText(article.bodyHtml);
      const draftText = article.type === "image" && !article.ocrConfirmed
        ? getDraftRecognizedText(article)
        : "";
      if (draftText.trim()) return plainTextToEditorHtml(draftText);
      return (article.body || [])
        .map((paragraph) => "<p>" + escapeHtml(paragraph).replace(/\n/g, "<br>") + "</p>")
        .join("");
    }

    function getEditorPlainText(editor = $("#editText")) {
      return String(editor?.innerText || "").replace(/\u00a0/g, " ").trim();
    }

    function syncEditorToArticle({ publishOcr = false, refreshList = true } = {}) {
      const articleId = populatedEditorArticleId || selectedArticle?.id;
      const article = articles.find((item) => item.id === articleId);
      if (!article) return false;

      const titleValue = $("#editTitle")?.value.trim();
      const bodyEditor = $("#editText");
      const plainText = getEditorPlainText(bodyEditor);
      const richHtml = sanitizeRichText(bodyEditor?.innerHTML || "");
      if (titleValue) article.title = titleValue;
      article.bodyHtml = richHtml;
      article.body = plainText
        ? plainText.split(/\n{2,}/).map((paragraph) => paragraph.trim()).filter(Boolean)
        : [];
      article.summary = plainText.replace(/\s+/g, " ").slice(0, 140) || article.summary;
      article.contentSchemaVersion = 2;

      if (article.type === "image") {
        article.highlightedDraft = [];
        article.ocrDraftText = plainText;
        if (publishOcr || article.ocrConfirmed) {
          article.highlightedText = [];
          article.ocrText = plainText;
          article.ocrConfirmed = Boolean(plainText);
          article.ocrStatus = "done";
          article.ocrError = "";
          article.aiProcessed = Boolean(plainText);
        }
      }

      article.folder = getFolderName(article.folderId);
      const saved = saveState();
      if (refreshList) renderList();
      return saved;
    }

    function notifyEditorInput() {
      $("#editText").dispatchEvent(new Event("input", { bubbles: true }));
    }

    function rememberEditorSelection() {
      const editor = $("#editText");
      const selection = window.getSelection();
      if (!editor || !selection?.rangeCount) return;
      const range = selection.getRangeAt(0);
      const container = range.commonAncestorContainer;
      if (container === editor || editor.contains(container)) {
        savedEditorRange = range.cloneRange();
        updateEditorToolbarState();
      }
    }

    function restoreEditorSelection() {
      if (!savedEditorRange) return;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedEditorRange);
    }

    function applyRichTextCommand(command, value = null) {
      const editor = $("#editText");
      if (!editor || editor.getAttribute("contenteditable") !== "true") return;
      editor.focus();
      restoreEditorSelection();
      document.execCommand("styleWithCSS", false, false);
      document.execCommand(command, false, value);
      rememberEditorSelection();
      notifyEditorInput();
    }

    function applyEditorBlockStyle(style) {
      const blocks = {
        paragraph: "<p>",
        heading1: "<h1>",
        heading2: "<h2>",
        quote: "<blockquote>"
      };
      applyRichTextCommand("formatBlock", blocks[style] || "<p>");
    }

    function applyEditorFontSize(value) {
      const editor = $("#editText");
      const requestedSize = Math.round(Number(value));
      if (!editor || !EDITOR_FONT_SIZES.includes(requestedSize)) return;
      editor.focus();
      restoreEditorSelection();
      const selection = window.getSelection();
      if (!selection?.rangeCount || selection.isCollapsed) {
        showToast("请先选择要调整大小的文字");
        updateEditorToolbarState();
        return;
      }
      const range = selection.getRangeAt(0);
      const container = range.commonAncestorContainer;
      if (container !== editor && !editor.contains(container)) return;

      document.execCommand("styleWithCSS", false, false);
      document.execCommand("fontSize", false, "7");
      editor.querySelectorAll('font[size="7"]').forEach((fontNode) => {
        const span = document.createElement("span");
        span.style.fontSize = `${requestedSize}px`;
        while (fontNode.firstChild) span.appendChild(fontNode.firstChild);
        fontNode.replaceWith(span);
      });
      rememberEditorSelection();
      notifyEditorInput();
    }

    function nearestEditorFontSize(value) {
      return EDITOR_FONT_SIZES.reduce((nearest, size) => (
        Math.abs(size - value) < Math.abs(nearest - value) ? size : nearest
      ), EDITOR_FONT_SIZES[0]);
    }

    function readEditorImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("图片读取失败"));
        reader.readAsDataURL(file);
      });
    }

    function decodeEditorImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("图片格式无法读取"));
        image.src = source;
      });
    }

    async function prepareEditorImage(file) {
      if (!file?.type?.startsWith("image/")) throw new Error("请选择图片文件");
      if (file.size > EDITOR_IMAGE_MAX_FILE_BYTES) throw new Error("单张图片不能超过 12 MB");
      const source = await readEditorImageFile(file);
      const image = await decodeEditorImage(source);
      const longestSide = Math.max(image.naturalWidth, image.naturalHeight);
      const scale = Math.min(1, 1400 / Math.max(longestSide, 1));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext("2d");
      if (!context) throw new Error("浏览器无法处理图片");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      let optimizedSource = canvas.toDataURL("image/webp", 0.82);

      if (optimizedSource.length > EDITOR_IMAGE_MAX_DATA_LENGTH) {
        const smallerScale = Math.min(1, 1000 / Math.max(longestSide, 1));
        canvas.width = Math.max(1, Math.round(image.naturalWidth * smallerScale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * smallerScale));
        const smallerContext = canvas.getContext("2d");
        smallerContext.drawImage(image, 0, 0, canvas.width, canvas.height);
        optimizedSource = canvas.toDataURL("image/webp", 0.72);
      }
      if (optimizedSource.length > EDITOR_IMAGE_MAX_DATA_LENGTH) {
        throw new Error("图片压缩后仍然过大");
      }

      return {
        source: optimizedSource,
        alt: String(file.name || "插入图片").replace(/\.[^.]+$/, "").slice(0, 180)
      };
    }

    function getEditorInsertionBlock(editor) {
      const selection = window.getSelection();
      if (!selection?.rangeCount) return null;
      const range = selection.getRangeAt(0);
      const container = range.startContainer;
      const element = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
      if (!element || (element !== editor && !editor.contains(element))) return null;
      const listItem = element.closest("li");
      if (listItem && editor.contains(listItem)) return listItem.closest("ul, ol") || listItem;
      const block = element.closest("p, div, h1, h2, h3, blockquote, figure");
      return block && editor.contains(block) ? block : null;
    }

    async function insertEditorImages(fileList) {
      const editor = $("#editText");
      const input = $("#editorImageInput");
      const articleId = populatedEditorArticleId;
      const files = Array.from(fileList || []).filter((file) => file.type?.startsWith("image/")).slice(0, 6);
      if (!editor || !files.length) {
        input.value = "";
        return;
      }

      setEditorSaveStatus("正在处理图片...");
      try {
        const preparedImages = [];
        for (const file of files) {
          preparedImages.push(await prepareEditorImage(file));
        }
        if (articleId !== populatedEditorArticleId) {
          showToast("当前文章已切换，图片没有插入");
          return;
        }

        editor.focus();
        restoreEditorSelection();
        const insertionBlock = getEditorInsertionBlock(editor);
        const fragment = document.createDocumentFragment();
        preparedImages.forEach((item) => {
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          image.src = item.source;
          image.alt = item.alt;
          image.loading = "lazy";
          image.draggable = false;
          figure.appendChild(image);
          fragment.appendChild(figure);
        });
        const trailingParagraph = document.createElement("p");
        trailingParagraph.appendChild(document.createElement("br"));
        fragment.appendChild(trailingParagraph);

        if (insertionBlock) insertionBlock.after(fragment);
        else editor.appendChild(fragment);

        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(trailingParagraph);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
        savedEditorRange = range.cloneRange();
        notifyEditorInput();
        const saved = commitEditorDraft();
        showToast(saved
          ? `已插入并保存 ${preparedImages.length} 张图片`
          : "图片已插入，但本地空间不足，暂未保存");
      } catch (error) {
        setEditorSaveStatus("图片插入失败", "error");
        showToast(error.message || "图片插入失败");
      } finally {
        input.value = "";
      }
    }

    function updateEditorToolbarState() {
      const editor = $("#editText");
      if (!editor || document.activeElement !== editor) return;
      $("#editorBold").classList.toggle("active", document.queryCommandState("bold"));
      $("#editorItalic").classList.toggle("active", document.queryCommandState("italic"));
      $("#editorList").classList.toggle("active", document.queryCommandState("insertUnorderedList"));
      const block = String(document.queryCommandValue("formatBlock") || "").toLowerCase();
      $("#editorQuote").classList.toggle("active", block === "blockquote");
      $("#editorBlockStyle").value = block === "h1"
        ? "heading1"
        : block === "h2"
          ? "heading2"
          : block === "blockquote"
            ? "quote"
            : "paragraph";

      const selection = window.getSelection();
      const anchorNode = selection?.anchorNode;
      const anchorElement = anchorNode?.nodeType === Node.ELEMENT_NODE ? anchorNode : anchorNode?.parentElement;
      if (anchorElement && (anchorElement === editor || editor.contains(anchorElement))) {
        const computedSize = Number.parseFloat(getComputedStyle(anchorElement).fontSize) || 18;
        $("#editorFontSize").value = String(nearestEditorFontSize(computedSize));
      }
    }

    function setEditorSaveStatus(message, state = "") {
      const status = $("#editorSaveStatus");
      if (!status) return;
      status.textContent = message;
      status.dataset.state = state;
    }

    function commitEditorDraft({ refreshList = true, silent = false } = {}) {
      clearTimeout(editSyncTimer);
      const saved = syncEditorToArticle({ refreshList });
      if (!silent) {
        const isImageDraft = selectedArticle?.type === "image" && !selectedArticle.ocrConfirmed;
        setEditorSaveStatus(
          saved ? (isImageDraft ? "草稿已自动保存" : "已自动保存") : "保存失败",
          saved ? "saved" : "error"
        );
      }
      return saved;
    }

    function scheduleEditSync() {
      setEditorSaveStatus("正在保存...");
      clearTimeout(editSyncTimer);
      editSyncTimer = setTimeout(() => commitEditorDraft(), 450);
    }

    function populateEditFields() {
      if (!selectedArticle) return;
      const titleInput = $("#editTitle");
      const bodyEditor = $("#editText");
      const articleChanged = populatedEditorArticleId !== selectedArticle.id;
      if (articleChanged || document.activeElement !== titleInput) {
        titleInput.value = selectedArticle.title;
      }
      if (articleChanged || document.activeElement !== bodyEditor) {
        bodyEditor.innerHTML = getEditorHtml(selectedArticle);
      }
      if (articleChanged) savedEditorRange = null;
      populatedEditorArticleId = selectedArticle.id;
      renderEditorTags();

      const isImage = selectedArticle.type === "image";
      const isWorking = isImage && ["ocr", "extracting"].includes(selectedArticle.ocrStatus);
      const workflow = $("#editOcrWorkflow");
      const extractButton = $("#editExtractMarkedText");
      const saveButton = $("#saveArticleButton");
      workflow.hidden = !isImage;
      extractButton.hidden = !isImage;
      extractButton.disabled = isWorking;
      saveButton.disabled = isWorking;

      if (isImage) {
        $("#editOcrStatus").textContent = isWorking
          ? "正在识别图片文字..."
          : selectedArticle.ocrError
            ? "识别未完成：" + selectedArticle.ocrError
            : selectedArticle.ocrConfirmed
              ? "识别内容已保存，可继续编辑"
              : "OCR 草稿待确认";
      }
      setEditorSaveStatus(isWorking ? "识别中..." : isImage && !selectedArticle.ocrConfirmed ? "草稿未确认" : "已保存");
    }

    function saveArticleEdits() {
      if (!selectedArticle) return;
      clearTimeout(editSyncTimer);
      const plainText = getEditorPlainText();
      const isImage = selectedArticle.type === "image";
      if (isImage && !plainText) {
        showToast("请先提取或输入识别文字");
        return;
      }
      const saved = syncEditorToArticle({ publishOcr: isImage });
      if (!saved) {
        if (isImage) selectedArticle.ocrConfirmed = false;
        setEditorSaveStatus("保存失败", "error");
        showToast("保存失败，内容仍保留在编辑器中");
        return;
      }
      renderAll();
      setEditorSaveStatus("已保存", "saved");
      showToast(isImage ? "识别内容已保存" : "文章已保存");
    }

    function handleFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const acceptedFiles = files
        .map((file) => ({ file, type: fileTypeFromMime(file) }))
        .filter((item) => item.type);
      const rejectedCount = files.length - acceptedFiles.length;
      if (!acceptedFiles.length) {
        showToast("仅支持 PDF 和图片文件");
        return;
      }
      pendingUploads.forEach((item) => {
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      });
      pendingUploads = acceptedFiles.map(({ file, type }) => ({
        file,
        name: file.name,
        size: file.size,
        mime: file.type || "unknown",
        type,
        previewUrl: type === "image" ? URL.createObjectURL(file) : null
      }));
      renderPendingUploads();
      showToast(rejectedCount
        ? "已选择 " + pendingUploads.length + " 个文件，忽略 " + rejectedCount + " 个不支持的文件"
        : "已选择 " + pendingUploads.length + " 个文件");

    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      if (tesseractLoader) return tesseractLoader;
      tesseractLoader = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = TESSERACT_CDN;
        script.async = true;
        script.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error("Tesseract.js 加载失败"));
        script.onerror = () => reject(new Error("无法加载 Tesseract.js，请检查网络或改用手动录入画线文字"));
        document.head.appendChild(script);
      });
      return tesseractLoader;
    }

    function imageFromUrl(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("图片无法读取，无法执行 OCR"));
        image.src = url;
      });
    }

    function detectMarkedRegions(image) {
      const maxWidth = 1200;
      const scale = Math.min(1, maxWidth / image.naturalWidth);
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0, width, height);
      const pixels = ctx.getImageData(0, 0, width, height).data;
      const rows = [];

      for (let y = 0; y < height; y += 1) {
        let marked = 0;
        let minX = width;
        let maxX = 0;
        let yellow = 0;
        let underline = 0;
        for (let x = 0; x < width; x += 1) {
          const index = (y * width + x) * 4;
          const r = pixels[index];
          const g = pixels[index + 1];
          const b = pixels[index + 2];
          const isYellow = r > 175 && g > 145 && b < 145 && r - b > 55;
          const isRedOrBlueLine = (r > 145 && g < 120 && b < 120) || (b > 125 && r < 130 && g < 155);
          const isDarkLine = r < 95 && g < 95 && b < 95;
          if (isYellow || isRedOrBlueLine || isDarkLine) {
            marked += 1;
            if (isYellow) yellow += 1;
            if (isRedOrBlueLine || isDarkLine) underline += 1;
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
          }
        }
        const density = marked / width;
        const longEnough = maxX - minX > width * 0.18;
        if (longEnough && (density > 0.045 || yellow / width > 0.025 || underline / width > 0.03)) {
          rows.push({ y, minX, maxX, yellow, underline, density });
        }
      }

      const regions = [];
      rows.forEach((row) => {
        const last = regions[regions.length - 1];
        if (last && row.y - last.bottom <= 5) {
          last.bottom = row.y;
          last.x = Math.min(last.x, row.minX);
          last.right = Math.max(last.right, row.maxX);
          last.yellow += row.yellow;
          last.underline += row.underline;
          last.density = Math.max(last.density, row.density);
        } else {
          regions.push({
            x: row.minX,
            right: row.maxX,
            y: row.y,
            bottom: row.y,
            yellow: row.yellow,
            underline: row.underline,
            density: row.density
          });
        }
      });

      return regions.map((region) => {
        const type = region.yellow >= region.underline ? "highlight" : "underline";
        const padY = type === "highlight" ? 8 : 28;
        return {
          x: Math.max(0, Math.round(region.x / scale) - 12),
          y: Math.max(0, Math.round(region.y / scale) - padY),
          width: Math.min(image.naturalWidth, Math.round((region.right - region.x) / scale) + 24),
          height: Math.min(image.naturalHeight, Math.round((region.bottom - region.y) / scale) + padY + 14),
          type,
          confidence: Math.min(96, Math.round((region.density * 650) + (type === "highlight" ? 24 : 18)))
        };
      }).filter((region) => region.width > image.naturalWidth * 0.16);
    }

    function normalizeOcrBlocks(data) {
      const source = Array.isArray(data?.lines) && data.lines.length
        ? data.lines
        : Array.isArray(data?.words) ? data.words : [];
      return source.map((item) => {
        const bbox = item.bbox || {};
        return {
          text: (item.text || "").trim(),
          confidence: Number(item.confidence || data?.confidence || 0),
          x: Number(bbox.x0 || item.x0 || 0),
          y: Number(bbox.y0 || item.y0 || 0),
          width: Number((bbox.x1 ?? item.x1 ?? 0) - (bbox.x0 ?? item.x0 ?? 0)),
          height: Number((bbox.y1 ?? item.y1 ?? 0) - (bbox.y0 ?? item.y0 ?? 0))
        };
      }).filter((item) => item.text && item.width >= 0 && item.height >= 0);
    }

    async function runOCR(imageUrl) {
      const Tesseract = await loadTesseract();
      const result = await Tesseract.recognize(imageUrl, "eng+chi_sim");
      const data = result.data || {};
      return {
        text: (data.text || "").trim(),
        blocks: normalizeOcrBlocks(data),
        confidence: Number(data.confidence || 0)
      };
    }

    function overlaps(a, b) {
      const ax2 = a.x + a.width;
      const ay2 = a.y + a.height;
      const bx2 = b.x + b.width;
      const by2 = b.y + b.height;
      const overlapX = Math.max(0, Math.min(ax2, bx2) - Math.max(a.x, b.x));
      const overlapY = Math.max(0, Math.min(ay2, by2) - Math.max(a.y, b.y));
      const area = Math.max(1, a.width * a.height);
      return (overlapX * overlapY) / area;
    }

    function extractMarkedText(ocrBlocks, regions) {
      if (!ocrBlocks.length || !regions.length) return [];
      return regions.map((region) => {
        const matched = ocrBlocks.filter((block) => overlaps(block, region) > 0.08 || Math.abs((block.y + block.height) - (region.y + region.height)) < 24);
        return {
          text: matched.map((block) => block.text).join(" ").replace(/\s+/g, " ").trim(),
          confidence: Math.round(Math.max(region.confidence, ...matched.map((block) => block.confidence || 0))),
          source: region.type
        };
      }).filter((item) => item.text);
    }

    async function runImageExtraction(articleId) {
      const article = findArticle(articleId);
      if (!article || article.type !== "image" || !article.previewUrl) {
        showToast("当前条目没有可识别图片");
        return;
      }
      setArticleAiState(articleId, { ocrStatus: "ocr", ocrError: "" });
      try {
        const image = await imageFromUrl(article.previewUrl);
        const regions = detectMarkedRegions(image);
        setArticleAiState(articleId, { ocrStatus: "extracting" });
        const ocr = await runOCR(article.previewUrl);
        const fragments = extractMarkedText(ocr.blocks, regions);
        const markedText = fragments.map((item) => item.text).filter(Boolean).join("\n").trim();
        const recognizedText = markedText || ocr.text.trim();
        const hasText = Boolean(recognizedText);
        setArticleAiState(articleId, {
          ocrStatus: hasText ? "done" : "error",
          ocrError: hasText ? "" : "没有识别到文字，可以直接在编辑器中手动输入。",
          ocrDraftText: recognizedText,
          highlightedDraft: [],
          bodyHtml: hasText ? "" : article.bodyHtml,
          body: hasText ? [] : article.body,
          ocrConfirmed: hasText ? false : article.ocrConfirmed,
          ocrConfidence: ocr.confidence,
          aiProcessed: article.ocrConfirmed && article.aiProcessed
        });
        showToast(hasText ? "OCR 完成，请确认后保存" : "没有识别到文字，可手动输入");
      } catch (error) {
        setArticleAiState(articleId, {
          ocrStatus: "error",
          ocrError: error.message || "OCR 失败，可手动录入画线文字"
        });
        showToast("OCR 失败，可手动录入");
      }
    }

      $("#nextCalendarMonth").addEventListener("click", () => shiftCalendarMonth(1));
      $("#readingLogForm").addEventListener("submit", saveReadingLog);
      $("#readingGoalForm").addEventListener("submit", saveReadingGoal);
      $("#readingStickerPicker").addEventListener("click", (event) => {
        const choice = event.target.closest("[data-reading-sticker]");
        if (!choice) return;
        selectedReadingStickerId = normalizeReadingStickerId(choice.dataset.readingSticker);
        renderReadingStickerPicker();
      });
      $("#readingBookInput").addEventListener("change", reuseReadingStickerForBookTitle);
      $("#newRootFolder").addEventListener("click", () => openFolderModal(null));
      wireFolderRootDropZone();
      $("#resetDemoState").addEventListener("click", resetDemoState);
      $("#createChildFolder").addEventListener("click", () => {
        if (folderMenuTargetId) openFolderModal(folderMenuTargetId);
      });
      $("#deleteFolderButton").addEventListener("click", () => {
        if (folderMenuTargetId) deleteFolder(folderMenuTargetId);
      });
      $("#renameFolderButton").addEventListener("click", () => {
        if (folderMenuTargetId) openRenameFolderModal(folderMenuTargetId);
      });
      $("#deleteArticleButton").addEventListener("click", () => {
        if (articleMenuTargetId) deleteArticle(articleMenuTargetId);
      });
      $("#saveFolderButton").addEventListener("click", submitFolderForm);
      $("#folderNameInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submitFolderForm();
        }
      });
      $("#deleteCurrentArticle").addEventListener("click", () => deleteArticle(selectedArticle?.id));
      $("#favoriteButton").addEventListener("click", () => {
        if (!selectedArticle) return;
        selectedArticle.favorite = !selectedArticle.favorite;
        saveState();
        renderAll();
        showToast(selectedArticle.favorite ? "已收藏" : "已取消收藏");
      });

      $$(".add-tabs button").forEach((button) => {
        button.addEventListener("click", () => {
          activateAddTab(button.dataset.addTab);
        });
      });

      $$("[data-close]").forEach((button) => {
        button.addEventListener("click", () => $("#" + button.dataset.close).classList.remove("open"));
      });

      $$(".overlay").forEach((overlay) => {
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) overlay.classList.remove("open");
        });
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          saveArticleEdits();
        }
        if (event.key === "Escape") {
          $$(".overlay").forEach((overlay) => overlay.classList.remove("open"));
          closeFolderMenu();
          closeArticleMenu();
          closeTagPicker();
        }
      });

      window.addEventListener("beforeunload", () => {
        if (populatedEditorArticleId) commitEditorDraft({ refreshList: false, silent: true });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest("#folderMenu") && !event.target.closest(".tree-more")) {
          closeFolderMenu();
        }
        if (!event.target.closest("#articleMenu")) {
          closeArticleMenu();
        }
        const eventPath = event.composedPath();
        if (!eventPath.includes($("#tagPopover")) && !eventPath.includes($("#openTagPicker"))) {
          closeTagPicker();
        }
      });

    }

    loadState();
    renderAddBody("markdown");
    renderAll();
    wireEvents();
  </script>
</body>
</html>
