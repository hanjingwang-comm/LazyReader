<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Reader Mac App Prototype</title>
  <style>
    :root {
      --bg: #eef1f4;
      --paper: #fbfaf7;
      --panel: rgba(255, 255, 255, 0.68);
      --panel-solid: #ffffff;
      --line: rgba(28, 31, 35, 0.12);
      --line-strong: rgba(28, 31, 35, 0.2);
      --text: #1b1e22;
      --muted: #707780;
      --faint: #9aa1a9;
      --accent: #4f6f57;
      --accent-strong: #31533d;
      --accent-soft: #dfe7de;
      --blue: #426f9f;
      --rust: #9b5c44;
      --gold: #a9863b;
      --shadow: 0 24px 70px rgba(37, 44, 52, 0.28);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --serif: Charter, "Iowan Old Style", "New York", Georgia, serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font);
      background:
        radial-gradient(circle at 18% 12%, rgba(139, 164, 184, 0.36), transparent 28%),
        radial-gradient(circle at 76% 18%, rgba(182, 160, 112, 0.28), transparent 29%),
        linear-gradient(145deg, #e5e8ec 0%, #f3f0e9 48%, #dde5df 100%);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      background: transparent;
    }

    .stage {
      height: 100vh;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 26px;
    }

    .window {
      width: min(1440px, calc(100vw - 52px));
      height: min(880px, calc(100vh - 52px));
      min-height: 0;
      display: grid;
      grid-template-columns: 230px 330px minmax(0, 1fr);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(248, 249, 248, 0.72);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(36px) saturate(150%);
      -webkit-backdrop-filter: blur(36px) saturate(150%);
      position: relative;
    }

    .window > * {
      min-height: 0;
    }

    .traffic {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 19px 0 14px 19px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.7px rgba(0, 0, 0, 0.12);
    }

    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }

    .sidebar {
      min-width: 0;
      padding: 0 12px 14px;
      background: rgba(230, 236, 236, 0.56);
      border-right: 1px solid rgba(40, 48, 54, 0.1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }

    .brand {
      padding: 2px 8px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 750;
      background: linear-gradient(145deg, #516f5a, #293d31);
      box-shadow: 0 10px 22px rgba(49, 83, 61, 0.25);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .nav-section {
      margin: 9px 0 0;
    }

    .section-label {
      padding: 8px 10px 5px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(68, 76, 84, 0.62);
    }

    .nav-item,
    .tree-item {
      width: 100%;
      height: 32px;
      border-radius: 9px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #31363c;
      transition: background 150ms ease, color 150ms ease;
    }

    .folder-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 5px 10px;
    }

    .folder-section-header .section-label {
      padding: 0;
    }

    .mini-icon-button {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #4f5a60;
    }

    .mini-icon-button:hover {
      background: rgba(255, 255, 255, 0.58);
    }

    .nav-item:hover,
    .tree-item:hover {
      background: rgba(255, 255, 255, 0.48);
    }

    .nav-item.active,
    .tree-item.active {
      background: rgba(255, 255, 255, 0.82);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65), 0 6px 16px rgba(36, 44, 52, 0.08);
    }

    .glyph {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      color: var(--accent);
    }

    .glyph svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .nav-text {
      flex: 1;
      min-width: 0;
      text-align: left;
      font-size: 13px;
      font-weight: 580;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count {
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
    }

    .tree-row {
      position: relative;
      margin: 0 0 2px;
    }

    .tree-row .tree-item {
      padding-right: 33px;
    }

    .tree-row .count {
      margin-right: 2px;
    }

    .tree-more {
      position: absolute;
      right: 12px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      opacity: 0;
      transition: opacity 150ms ease, background 150ms ease;
    }

    .tree-row:hover .tree-more,
    .tree-more:focus-visible {
      opacity: 1;
    }

    .tree-more:hover {
      background: rgba(255, 255, 255, 0.65);
    }

    .tree-level-1 .tree-item {
      padding-left: 28px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 8px 2px;
    }

    .storage {
      padding: 12px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.62);
    }

    .meter {
      height: 5px;
      margin: 9px 0 7px;
      border-radius: 99px;
      background: rgba(48, 55, 61, 0.12);
      overflow: hidden;
    }

    .meter span {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--blue));
    }

    .tiny {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
    }

    .link-button {
      margin-top: 8px;
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 720;
    }

    .link-button:hover {
      text-decoration: underline;
    }

    .list-pane {
      border-right: 1px solid var(--line);
      background: rgba(250, 250, 248, 0.72);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .toolbar {
      height: 64px;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(31, 36, 42, 0.08);
    }

    .search {
      height: 36px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 11px;
      color: var(--faint);
      background: rgba(236, 239, 240, 0.88);
      box-shadow: inset 0 0 0 1px rgba(30, 36, 42, 0.07);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      color: var(--text);
      background: transparent;
      font-size: 13px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #2f3a42;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(24, 30, 36, 0.08);
      transition: transform 150ms ease, background 150ms ease;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      background: #fff;
    }

    .icon-button.primary {
      color: #fff;
      background: var(--accent-strong);
      border-color: rgba(49, 83, 61, 0.16);
    }

    .icon-button.danger {
      color: #9b3f35;
    }

    .pane-title {
      padding: 14px 18px 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .pane-title h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .sort {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .chips {
      display: flex;
      gap: 7px;
      padding: 0 18px 13px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      height: 26px;
      padding: 0 10px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
      color: #4a535a;
      background: rgba(239, 241, 240, 0.96);
      border: 1px solid rgba(30, 36, 42, 0.06);
    }

    .chip.active {
      color: var(--accent-strong);
      background: var(--accent-soft);
    }

    .article-list {
      overflow: auto;
      padding: 0 10px 14px;
    }

    .empty-state {
      margin: 18px 8px;
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
      border: 1px dashed rgba(38, 45, 50, 0.16);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 6px;
      color: #3f474d;
      font-size: 14px;
    }

    .article-card {
      width: 100%;
      padding: 13px 12px;
      margin: 0 0 8px;
      border-radius: 15px;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      position: relative;
      cursor: pointer;
    }

    .article-card:hover {
      background: rgba(255, 255, 255, 0.62);
    }

    .article-card.active {
      background: #fff;
      border-color: rgba(39, 45, 52, 0.1);
      box-shadow: 0 10px 28px rgba(35, 42, 50, 0.08);
    }

    .article-more {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--muted);
      opacity: 0;
      transition: opacity 150ms ease, background 150ms ease;
    }

    .article-card:hover .article-more,
    .article-more:focus-visible {
      opacity: 1;
    }

    .article-more:hover {
      background: rgba(238, 242, 238, 0.9);
    }


    .card-title {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.28;
      font-weight: 750;
      color: #1f2429;
    }

    .card-desc {
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #667078;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .tag {
      padding: 3px 7px;
      border-radius: 99px;
      color: #53605a;
      background: #eef2ee;
      font-size: 11px;
      font-weight: 650;
    }

    .reader-shell {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 64px 1fr;
      background: var(--paper);
      position: relative;
    }

    .reader-toolbar {
      padding: 13px 18px 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(31, 36, 42, 0.08);
      background: rgba(251, 250, 247, 0.82);
    }

    .reader-toolbar .spacer { flex: 1; }

    .segmented {
      height: 36px;
      padding: 3px;
      border-radius: 12px;
      display: flex;
      gap: 2px;
      background: rgba(230, 231, 226, 0.72);
      border: 1px solid rgba(34, 39, 44, 0.08);
    }

    .segmented button {
      min-width: 74px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .segmented button.active {
      color: var(--text);
      background: #fff;
      box-shadow: 0 3px 10px rgba(35, 40, 45, 0.08);
    }

    .reader-grid {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 304px;
    }

    .reading-checkin-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      border-left: 1px solid var(--line);
      background: rgba(246, 247, 243, 0.9);
    }

    .checkin-calendar-section {
      padding: 18px 16px 15px;
      border-bottom: 1px solid rgba(31, 36, 42, 0.08);
    }

    .checkin-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .checkin-heading h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .checkin-heading p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .checkin-add-button {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: var(--accent-strong);
      box-shadow: 0 7px 16px rgba(49, 83, 61, 0.2);
      transition: transform 150ms ease, background 150ms ease;
    }

    .checkin-add-button:hover {
      transform: translateY(-1px);
      background: #264633;
    }

    .calendar-toolbar {
      height: 34px;
      margin-top: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .calendar-month-label {
      font-size: 13px;
      font-weight: 760;
      color: #323a35;
    }

    .calendar-nav {
      display: flex;
      gap: 4px;
    }

    .calendar-nav button,
    .reading-log-delete {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--muted);
      transition: color 150ms ease, background 150ms ease;
    }

    .calendar-nav button:hover {
      color: var(--text);
      background: rgba(226, 231, 225, 0.92);
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
    }

    .calendar-weekdays {
      margin-top: 7px;
    }

    .calendar-weekdays span {
      height: 20px;
      display: grid;
      place-items: center;
      color: var(--faint);
      font-size: 9px;
      font-weight: 720;
    }

    .calendar-grid {
      grid-auto-rows: 34px;
    }

    .calendar-day,
    .calendar-blank {
      width: 100%;
      height: 34px;
      border-radius: 8px;
    }

    .calendar-day {
      position: relative;
      display: grid;
      place-items: center;
      color: #47504b;
      font-size: 11px;
      font-weight: 680;
      transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .calendar-day:hover {
      background: rgba(228, 233, 227, 0.82);
    }

    .calendar-day.selected {
      color: var(--accent-strong);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(49, 83, 61, 0.18);
    }

    .calendar-day.today::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 3px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--rust);
    }

    .calendar-day.has-log {
      color: #fff;
      background: var(--accent-strong);
    }

    .calendar-day.has-log:hover,
    .calendar-day.has-log.selected {
      background: #264633;
      box-shadow: 0 5px 12px rgba(49, 83, 61, 0.18);
    }

    .calendar-day.has-log .glyph {
      width: 15px;
      height: 15px;
    }

    .calendar-date-corner {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 7px;
      font-weight: 760;
      opacity: 0.72;
    }

    .calendar-log-count {
      position: absolute;
      top: 2px;
      right: 3px;
      min-width: 10px;
      font-size: 7px;
      font-weight: 780;
      opacity: 0.8;
    }

    .checkin-records-head {
      min-height: 58px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(31, 36, 42, 0.08);
    }

    .checkin-records-head strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
    }

    .checkin-records-head span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
    }

    .checkin-total-pages {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 8px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      font-size: 10px;
      font-weight: 760;
    }

    .reading-log-list {
      min-height: 0;
      overflow: auto;
      padding: 2px 16px 24px;
    }

    .reading-log-empty {
      padding: 26px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .reading-log-empty .glyph {
      width: 22px;
      height: 22px;
      margin: 0 auto 8px;
      color: var(--accent);
    }

    .reading-log-row {
      min-height: 72px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(31, 36, 42, 0.08);
    }

    .reading-log-mark {
      width: 30px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 7px 4px 4px 7px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 rgba(49, 83, 61, 0.2);
    }

    .reading-log-mark .glyph {
      width: 15px;
      height: 15px;
    }

    .reading-log-copy {
      min-width: 0;
    }

    .reading-log-title {
      overflow: hidden;
      color: #2d342f;
      font-size: 12px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reading-log-meta {
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .reading-status {
      padding: 2px 6px;
      border-radius: 6px;
      color: #5a4b25;
      background: #f1e7c9;
      font-weight: 720;
    }

    .reading-status.finished {
      color: #31533d;
      background: var(--accent-soft);
    }

    .reading-status.rereading {
      color: #44627e;
      background: #dfe8ef;
    }

    .reading-log-delete {
      opacity: 0;
      color: var(--rust);
    }

    .reading-log-row:hover .reading-log-delete,
    .reading-log-delete:focus-visible {
      opacity: 1;
    }

    .reading-log-delete:hover {
      background: rgba(155, 92, 68, 0.09);
    }

    @media (max-width: 860px) {
      .window {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar,
      .list-pane {
        display: none;
      }

      .reader-grid {
        grid-template-columns: minmax(0, 1fr) 280px;
      }

    }

    @media (max-width: 1180px) and (min-width: 861px) {
      .window {
        grid-template-columns: 210px minmax(0, 1fr);
      }

      .list-pane {
        display: none;
      }

      .reader-grid {
        grid-template-columns: minmax(0, 1fr) 292px;
      }
    }

    @media (max-width: 700px) {
      .reader-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .reading-checkin-panel {
        display: none;
      }
    }

    .article-view {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 40px clamp(26px, 4vw, 58px) 72px;
    }

    .article-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .article-meta .pill {
      padding: 5px 9px;
      border-radius: 99px;
      background: #edece7;
      color: #59605e;
    }

    .reader-title {
      margin: 18px 0 13px;
      max-width: 680px;
      font-family: var(--serif);

  </style>

  <style id="reading-sidebar-scroll">
    .reading-checkin-panel {
      grid-template-rows: max-content max-content max-content max-content;
      align-content: start;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
    }

    .reading-log-list {
      min-height: auto;
      overflow: visible;
    }
  </style>

  <style id="reading-log-editing">
    .reading-log-row {
      grid-template-columns: 30px minmax(0, 1fr) auto;
    }

    .reading-log-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .reading-log-action {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      opacity: 0.68;
      transition: opacity 140ms ease, background 140ms ease;
    }

    .reading-log-action .glyph,
    .reading-log-action .glyph svg {
      width: 14px;
      height: 14px;
    }

    .reading-log-edit {
      color: #315b96;
    }

    .reading-log-edit:hover {
      background: #dfe8f4;
    }

    .reading-log-delete {
      opacity: 0.68;
    }

    .reading-log-row:hover .reading-log-action,
    .reading-log-action:focus-visible {
      opacity: 1;
    }

    .reading-log-action:focus-visible {
      outline: 2px solid #315b96;
      outline-offset: 1px;
    }
  </style>

  <style id="library-organization-controls">
    .folder-nav-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #folderTree {
      min-height: 0;
      padding: 1px 4px 8px 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }

    #folderTree::-webkit-scrollbar {
      width: 5px;
    }

    #folderTree::-webkit-scrollbar-thumb {
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.18);
    }

    .tree-row .tree-item {
      gap: 6px;
    }

    .tree-disclosure {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      display: grid;
      place-items: center;
      color: #8e9a94;
      transform: rotate(0deg);
      transform-origin: center;
      transition: color 140ms ease, transform 160ms ease;
    }

    .tree-disclosure.is-open {
      transform: rotate(90deg);
    }

    .tree-disclosure.is-placeholder {
      visibility: hidden;
    }

    .tree-disclosure .glyph,
    .tree-disclosure .glyph svg {
      width: 10px;
      height: 10px;
      flex-basis: 10px;
    }

    .tree-item:hover .tree-disclosure,
    .tree-item.active .tree-disclosure {
      color: currentColor;
    }

    .folder-article-list {
      margin: -1px 7px 7px 20px;
      padding: 2px 0 2px 10px;
      border-left: 1px solid rgba(211, 221, 216, 0.2);
    }

    .folder-article-list.tree-level-2 {
      margin-left: 32px;
    }

    .folder-article-item {
      width: 100%;
      min-height: 29px;
      padding: 4px 7px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      border-radius: 5px;
      color: #b8c2bd;
      background: transparent;
      text-align: left;
      transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .folder-article-item::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 50%;
      width: 7px;
      border-top: 1px solid rgba(211, 221, 216, 0.2);
    }

    .folder-article-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.07);
    }

    .folder-article-item.active {
      color: #ffffff;
      background: rgba(49, 91, 150, 0.28);
      box-shadow: inset 2px 0 0 #d4ad45;
    }

    .folder-article-item .glyph,
    .folder-article-item .glyph svg {
      width: 13px;
      height: 13px;
      flex-basis: 13px;
      color: #899890;
    }

    .folder-article-item.active .glyph {
      color: #d4ad45;
    }

    .folder-article-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11.5px;
      font-weight: 540;
      line-height: 1.35;
    }

    .folder-article-favorite {
      flex: 0 0 auto;
      color: #d4ad45;
      font-size: 10px;
    }

    .pane-title {
      align-items: center;
      padding-bottom: 10px;
    }

    .tag-filter-bar {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 18px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-filter-bar.expanded {
      align-items: flex-start;
    }

    .tag-filter-bar.empty {
      display: none;
    }

    .list-pane .article-list {
      flex: 1 1 auto;
      min-height: 0;
    }

    .tag-filter-symbol {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: #64706a;
    }

    .tag-filter-list {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
    }

    .tag-filter-bar.expanded .tag-filter-list {
      flex-wrap: wrap;
      overflow: visible;
    }

    .tag-filter-chip {
      min-height: 26px;
      padding: 4px 8px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(31, 36, 42, 0.08);
      border-radius: 3px;
      color: var(--tag-fg);
      background: color-mix(in srgb, var(--tag-bg) 72%, #ffffff);
      clip-path: polygon(1px 0, 100% 1px, calc(100% - 1px) 100%, 0 calc(100% - 1px));
      font-size: 10.5px;
      font-weight: 720;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0.78;
      transition: opacity 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }

    .tag-filter-chip:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .tag-filter-chip.active {
      opacity: 1;
      box-shadow: inset 0 -2px 0 rgba(31, 36, 42, 0.18), 0 0 0 2px #f3f5f4, 0 0 0 3px var(--tag-bg);
    }

    .tag-filter-chip[hidden] {
      display: none;
    }

    .tag-filter-count {
      min-width: 15px;
      padding-left: 5px;
      border-left: 1px solid color-mix(in srgb, var(--tag-fg) 24%, transparent);
      text-align: center;
      font-family: "American Typewriter", "Courier New", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 700;
      opacity: 0.72;
    }

    .tag-filter-overflow,
    .tag-filter-clear {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #5c6761;
    }

    .tag-filter-overflow {
      padding: 0 0 7px;
      align-self: flex-start;
      font-family: "American Typewriter", "Courier New", ui-monospace, monospace;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0;
    }

    .tag-filter-overflow:hover,
    .tag-filter-overflow[aria-expanded="true"],
    .tag-filter-clear:hover {
      color: #315b96;
      background: #e5ebf1;
    }

    .tag-filter-overflow[hidden],
    .tag-filter-clear[hidden] {
      display: none;
    }

    #folderParentField[hidden] {
      display: none;
    }

    .tree-row[draggable="true"],
    .article-card[draggable="true"] {
      cursor: grab;
    }

    .tree-row[draggable="true"]:active,
    .article-card[draggable="true"]:active {
      cursor: grabbing;
    }

    .tree-row.dragging,
    .article-card.dragging {
      opacity: 0.42;
    }

    .tree-row.folder-drop-target .tree-item {
      color: #172a22;
      background: #e5dcae;
      box-shadow: inset 0 0 0 1px #d5bf61, 0 4px 12px rgba(25, 33, 29, 0.12);
    }

    .tree-row.folder-drop-target .glyph {
      color: #315b4a;
    }

    .tree-row.folder-drop-invalid .tree-item {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .folder-section-header {
      border-radius: 6px;
      transition: color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .folder-section-header.folder-root-drop-target {
      color: #f4e8b9;
      background: rgba(244, 232, 185, 0.12);
      box-shadow: inset 0 0 0 1px rgba(244, 232, 185, 0.36);
    }

    body.library-dragging .tree-more {
      pointer-events: none;
    }
  </style>

</head>
<body>
  <main class="stage">
    <section class="window" data-screen-label="Reader Mac App">
      <aside class="sidebar" data-screen-label="Local Library Sidebar">
        <div class="traffic" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="brand">
          <div class="brand-mark">R</div>
          <div>
            <div class="brand-name">Reader</div>
            <div class="brand-sub">Local knowledge library</div>
          </div>
        </div>

        <div class="nav-section">
          <button class="nav-item active" data-filter="inbox">
            <span class="glyph" data-icon="inbox"></span>
            <span class="nav-text">档案袋</span>
            <span class="count">24</span>
          </button>
          <button class="nav-item" data-filter="favorite">
            <span class="glyph" data-icon="star"></span>
            <span class="nav-text">收藏</span>
            <span class="count">8</span>
          </button>
          <button class="nav-item book-stamp-nav" id="openBookStamps" type="button">
            <span class="glyph" data-icon="stamp"></span>
            <span class="nav-text">书籍邮票</span>
            <span class="count" id="bookStampCount">0</span>
          </button>
        </div>

        <div class="nav-section folder-nav-section">
          <div class="folder-section-header" id="folderRootDropZone" title="拖到这里移至一级目录">
            <div class="section-label">目录</div>
            <button class="mini-icon-button" id="newRootFolder" title="新建一级文件夹">
              <span class="glyph" data-icon="plus"></span>
            </button>
          </div>
          <div id="folderTree"></div>
        </div>

        <div class="sidebar-footer">
          <div class="storage">
            <div class="tiny"><strong>本地资料库</strong></div>
            <div class="meter"><span></span></div>
            <div class="tiny" id="storageSummary">0 items stored on this Mac</div>
            <button class="link-button" id="resetDemoState">重置示例数据</button>
          </div>
        </div>
      </aside>

      <section class="list-pane" data-screen-label="Content Collection">
        <div class="toolbar">
          <label class="search">
            <span class="glyph" data-icon="search"></span>
            <input id="librarySearch" type="search" placeholder="搜索标题、标签、全文" />
          </label>
          <button class="icon-button primary" id="openAdd" title="添加内容">
            <span class="glyph" data-icon="plus"></span>
          </button>
        </div>
        <div class="pane-title">
          <h1 id="listTitle">研究材料</h1>
        </div>
        <div class="tag-filter-bar" id="tagFilterBar" aria-label="标签筛选">
          <span class="glyph tag-filter-symbol" data-icon="tag" aria-hidden="true"></span>
          <div class="tag-filter-list" id="tagFilterList"></div>
          <button class="tag-filter-overflow" id="toggleTagFilterOverflow" type="button" title="展开全部标签筛选" aria-label="展开全部标签筛选" aria-expanded="false" hidden>&hellip;</button>
          <button class="tag-filter-clear" id="clearTagFilters" type="button" title="清除标签筛选" aria-label="清除标签筛选" hidden>
            <span class="glyph" data-icon="x"></span>
          </button>
        </div>
        <div class="article-list" id="articleList"></div>
      </section>

      <section class="reader-shell" data-screen-label="Reader Workspace">
        <div class="reader-grid" id="readerGrid">
          <div class="reader-toolbar">
          <div class="editor-format-bar" aria-label="文章编辑工具">
            <select class="editor-style-select" id="editorBlockStyle" aria-label="段落样式" title="段落样式">
              <option value="paragraph">正文</option>
              <option value="heading1">标题 1</option>
              <option value="heading2">标题 2</option>
              <option value="quote">引用</option>
            </select>
            <select class="editor-font-size-select" id="editorFontSize" aria-label="文字大小" title="文字大小">
              <option value="14">14</option>
              <option value="16">16</option>
              <option value="18" selected>18</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="28">28</option>
              <option value="32">32</option>
              <option value="36">36</option>
            </select>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button class="editor-tool-button text-tool" id="editorBold" title="加粗" aria-label="加粗"><strong>B</strong></button>
            <button class="editor-tool-button text-tool" id="editorItalic" title="斜体" aria-label="斜体"><em>I</em></button>
            <button class="editor-tool-button" id="editorList" title="项目列表" aria-label="项目列表">
              <span class="glyph" data-icon="list"></span>
            </button>
            <button class="editor-tool-button" id="editorQuote" title="引用" aria-label="引用">
              <span class="glyph" data-icon="quote"></span>
            </button>
            <button class="editor-tool-button" id="editorInsertImage" title="插入图片" aria-label="插入图片">
              <span class="glyph" data-icon="image"></span>
            </button>
            <input id="editorImageInput" type="file" accept="image/*" multiple hidden />
          </div>
            <div class="editor-actions" aria-label="文章操作">
              <span class="editor-save-status" id="editorSaveStatus">已保存</span>
              <button class="toolbar-text-button editor-image-action" id="editExtractMarkedText" title="提取划线文字" hidden>
                <span class="glyph" data-icon="scan-text"></span>
                <span class="button-label">提取文字</span>
              </button>
              <button class="toolbar-text-button save-button" id="saveArticleButton" title="保存文章">
                <span class="glyph" data-icon="save"></span>
                <span class="button-label">保存</span>
              </button>
              <button class="icon-button" id="favoriteButton" title="收藏">
                <span class="glyph" data-icon="star"></span>
              </button>
              <button class="icon-button danger" id="deleteCurrentArticle" title="删除当前条目">
                <span class="glyph" data-icon="trash"></span>
              </button>
            </div>
          </div>

          <article class="article-view" id="articleView">
            <div class="document-editor active" id="editMode">
              <input class="document-title-input" id="editTitle" aria-label="条目标题" placeholder="标题" autocomplete="off" />
              <div class="document-tag-editor">
                <button class="editor-tag-trigger" id="openTagPicker" type="button" title="添加标签" aria-label="添加标签" aria-expanded="false">
                  <span class="glyph" data-icon="tag"></span>
                </button>
                <div class="editor-tag-list" id="editorTagList" aria-label="当前文章标签"></div>
              </div>
              <div class="document-body-input" id="editText" contenteditable="true" role="textbox" aria-label="文章正文" aria-multiline="true" data-placeholder="开始写作..." spellcheck="true"></div>
              <div class="edit-ocr-workflow" id="editOcrWorkflow" hidden>
                <div class="edit-ocr-copy">
                  <strong id="editOcrStatus">OCR 草稿待确认</strong>
                  <span>识别草稿尚未保存。</span>
                </div>
              </div>
            </div>
          </article>

          <aside class="reading-checkin-panel" data-screen-label="Reading Check-in Sidebar">
            <div class="checkin-calendar-section">
              <div class="checkin-heading">
                <div>
                  <h2>阅读打卡</h2>
                  <p>选择日期，记录每天的阅读进度</p>
                </div>
                <button class="checkin-add-button" id="openReadingCheckin" title="添加阅读记录">
                  <span class="glyph" data-icon="plus"></span>
                </button>
              </div>
              <div class="calendar-toolbar">
                <strong class="calendar-month-label" id="calendarMonthLabel"></strong>
                <div class="calendar-nav">
                  <button id="previousCalendarMonth" title="上个月">
                    <span class="glyph" data-icon="chevron-left"></span>
                  </button>
                  <button id="nextCalendarMonth" title="下个月">
                    <span class="glyph" data-icon="chevron-right"></span>
                  </button>
                </div>
              </div>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
              </div>
              <div class="calendar-grid" id="readingCalendar"></div>
            </div>
            <div class="reading-stats" id="readingStats" aria-label="阅读统计">
              <div class="reading-stat">
                <span class="reading-stat-label">本月阅读</span>
                <div class="reading-stat-value">
                  <strong id="monthlyReadingDays">0</strong>
                  <small>天</small>
                </div>
              </div>
              <div class="reading-stat">
                <span class="reading-stat-label">累计天数</span>
                <div class="reading-stat-value">
                  <strong id="totalReadingDays">0</strong>
                  <small>天</small>
                </div>
              </div>
              <div class="reading-stat">
                <span class="reading-stat-label">今日阅读</span>
                <div class="reading-stat-value">
                  <strong id="todayReadingMinutes">0</strong>
                  <small>分钟</small>
                </div>
              </div>
              <button class="reading-stat reading-goal-stat" id="openReadingGoal" type="button" title="设置每月阅读目标">
                <span class="reading-stat-label">完成目标</span>
                <span class="reading-stat-value">
                  <strong id="readingGoalProgress">0</strong>
                  <small>%</small>
                </span>
                <span class="reading-goal-track" aria-hidden="true"><span id="readingGoalBar"></span></span>
              </button>
            </div>
            <div class="checkin-records-head">
              <div>
                <strong id="selectedReadingDateLabel"></strong>
                <span id="selectedReadingCount"></span>
              </div>
              <div class="checkin-total-pages" id="selectedReadingPages">0 页</div>
            </div>
            <div class="reading-log-list" id="readingLogList"></div>
          </aside>

        </div>
      </section>

      <div class="overlay" id="addOverlay">
        <div class="modal add-content-modal" data-screen-label="Add Content Modal">
          <div class="modal-head">
            <h2>Reader</h2>
            <div class="add-tabs">
              <button class="active" data-add-tab="markdown">文章</button>
              <button data-add-tab="file">附件</button>
            </div>
            <span class="add-entry-folio">NEW ENTRY / LOCAL</span>
            <button class="icon-button" data-close="addOverlay" title="关闭">
              <span class="glyph" data-icon="x"></span>
            </button>
          </div>
          <div class="add-body" id="addBody"></div>
        </div>
      </div>

      <div class="overlay" id="folderOverlay">
        <div class="modal" data-screen-label="Create Folder Modal">
          <div class="modal-head">
            <h2 id="folderModalTitle">新建文件夹</h2>
            <button class="icon-button" data-close="folderOverlay" title="关闭">
              <span class="glyph" data-icon="x"></span>
            </button>
          </div>
          <div class="add-body">
            <div class="form-stack">
              <label>
                文件夹名称
                <input id="folderNameInput" placeholder="例如：论文材料" />
              </label>
              <label id="folderParentField">
                位置
                <select id="folderParentSelect"></select>
              </label>
              <button class="action-button" id="saveFolderButton">创建文件夹</button>
            </div>
          </div>
        </div>
      </div>

      <div class="overlay" id="readingLogOverlay">
        <div class="modal checkin-modal" data-screen-label="Reading Check-in Modal">
          <div class="modal-head">
            <h2 id="readingLogModalTitle">添加阅读打卡</h2>
            <button class="icon-button" data-close="readingLogOverlay" title="关闭">
              <span class="glyph" data-icon="x"></span>
            </button>
          </div>
          <div class="add-body">
            <form class="form-stack" id="readingLogForm">
              <label>
                打卡日期
                <input id="readingDateInput" type="date" required />
              </label>
              <label>
                书名
                <input id="readingBookInput" maxlength="120" autocomplete="off" placeholder="输入正在阅读的书" required />
              </label>
              <fieldset class="reading-sticker-field">
                <legend>选择书籍剪贴图</legend>
                <div class="reading-sticker-picker" id="readingStickerPicker" role="listbox" aria-label="书籍剪贴图"></div>
              </fieldset>
              <label>
                本次阅读页数
                <input id="readingPagesInput" type="number" min="1" max="9999" step="1" inputmode="numeric" placeholder="例如：24" required />
              </label>
              <label>
                本次阅读时长（分钟）
                <input id="readingMinutesInput" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="例如：45" required />
              </label>
              <label>
                阅读状态
                <select id="readingStatusSelect">
                  <option value="reading">在读</option>
                  <option value="finished">读完</option>
                  <option value="rereading">重读</option>
                </select>
              </label>
              <button class="action-button checkin-submit" id="readingLogSubmitButton" type="submit">完成打卡</button>
            </form>
          </div>
        </div>
      </div>

      <div class="overlay" id="readingGoalOverlay">
        <div class="modal reading-goal-modal" data-screen-label="Reading Goal Modal">
          <div class="modal-head">
            <h2>设置月度阅读目标</h2>
            <button class="icon-button" data-close="readingGoalOverlay" title="关闭">
              <span class="glyph" data-icon="x"></span>
            </button>
          </div>
          <div class="add-body">
            <form class="form-stack" id="readingGoalForm">
              <label>
                每月目标天数
                <input id="readingGoalDaysInput" type="number" min="1" max="31" step="1" inputmode="numeric" required />
              </label>
              <button class="action-button" type="submit">保存目标</button>
            </form>
          </div>
        </div>
      </div>

      <div class="overlay" id="bookStampOverlay">
        <div class="modal book-stamp-modal" data-screen-label="Book Stamp Album">
          <div class="modal-head">

    function cloneData(data) {
      return JSON.parse(JSON.stringify(data));

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function normalizeTagName(value) {
      return String(value || "")
        .replace(/^#+/, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 30);
    }

    function colorIdForTag(name) {
      let hash = 0;
      Array.from(String(name || "")).forEach((character) => {
        hash = ((hash * 31) + character.codePointAt(0)) >>> 0;
      });
      return TAG_COLOR_OPTIONS[hash % TAG_COLOR_OPTIONS.length].id;
    }

    function getTagColorOption(colorId) {
      return TAG_COLOR_OPTIONS.find((option) => option.id === colorId)
        || TAG_COLOR_OPTIONS[TAG_COLOR_OPTIONS.length - 1];
    }

    function ensureTagCatalog() {
      const validColorIds = new Set(TAG_COLOR_OPTIONS.map((option) => option.id));
      const normalizedCatalog = [];
      const seen = new Set();

      (Array.isArray(tagCatalog) ? tagCatalog : []).forEach((entry) => {
        const name = normalizeTagName(typeof entry === "string" ? entry : entry?.name);
        const key = name.toLocaleLowerCase();
        if (!name || seen.has(key)) return;
        normalizedCatalog.push({
          name,
          color: validColorIds.has(entry?.color) ? entry.color : colorIdForTag(name)
        });
        seen.add(key);
      });

      articles.forEach((article) => {
        const articleTags = [];
        const articleSeen = new Set();
        (Array.isArray(article.tags) ? article.tags : []).forEach((rawTag) => {
          const name = normalizeTagName(rawTag);
          const key = name.toLocaleLowerCase();
          if (!name || articleSeen.has(key)) return;
          articleTags.push(name);
          articleSeen.add(key);
          if (!seen.has(key)) {
            normalizedCatalog.push({ name, color: colorIdForTag(name) });
            seen.add(key);
          }
        });
        article.tags = articleTags;
      });

      tagCatalog = normalizedCatalog;
    }

    function getTagDefinition(name) {
      const normalizedName = normalizeTagName(name);
      const key = normalizedName.toLocaleLowerCase();
      return tagCatalog.find((entry) => entry.name.toLocaleLowerCase() === key)
        || { name: normalizedName, color: colorIdForTag(normalizedName) };
    }

    function tagStyleFromColorId(colorId) {
      const color = getTagColorOption(colorId);
      return "--tag-bg:" + color.bg + ";--tag-fg:" + color.text;
    }

    function renderTagLabel(name, { removable = false } = {}) {
      const definition = getTagDefinition(name);
      const safeName = escapeHtml(definition.name);
      const removeButton = removable
        ? '<button class="editor-tag-remove" type="button" data-remove-tag="' + safeName + '" title="移除标签" aria-label="移除标签 ' + safeName + '"><span class="glyph" data-icon="x"></span></button>'
        : "";
      return '<span class="tag paper-tag' + (removable ? " editor-paper-tag" : "") + '" style="' + tagStyleFromColorId(definition.color) + '">' + safeName + removeButton + "</span>";
    }

    function getAvailableTagFilters() {
      const counts = new Map();
      articles.filter(matchesLibraryFilter).forEach((article) => {
        const seen = new Set();
        (article.tags || []).forEach((rawTag) => {
          const definition = getTagDefinition(rawTag);
          const key = definition.name.toLocaleLowerCase();
          if (!key || seen.has(key)) return;
          const current = counts.get(key) || { ...definition, count: 0 };
          current.count += 1;
          counts.set(key, current);
          seen.add(key);
        });
      });
      return Array.from(counts.values()).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
    }

    function layoutTagFilters() {
      const bar = $("#tagFilterBar");
      const list = $("#tagFilterList");
      const overflowButton = $("#toggleTagFilterOverflow");
      if (!bar || !list || !overflowButton || bar.classList.contains("empty")) return;

      const chips = Array.from(list.querySelectorAll(".tag-filter-chip"));
      const shouldExpand = tagFiltersExpanded;
      bar.classList.remove("expanded");
      chips.forEach((chip) => { chip.hidden = false; });
      overflowButton.hidden = false;
      overflowButton.style.visibility = "hidden";

      const availableWidth = list.getBoundingClientRect().width;
      const listStyles = getComputedStyle(list);
      const gap = parseFloat(listStyles.columnGap || listStyles.gap) || 0;
      let usedWidth = 0;
      let visibleCount = 0;

      for (const chip of chips) {
        const chipWidth = chip.getBoundingClientRect().width;
        const nextWidth = usedWidth + (visibleCount ? gap : 0) + chipWidth;
        if (nextWidth > availableWidth + 0.5) break;
        usedWidth = nextWidth;
        visibleCount += 1;
      }

      const hasOverflow = visibleCount < chips.length;
      overflowButton.style.visibility = "";
      overflowButton.hidden = !hasOverflow;
      if (!hasOverflow) tagFiltersExpanded = false;

      if (hasOverflow && shouldExpand) {
        tagFiltersExpanded = true;
        bar.classList.add("expanded");
      } else {
        tagFiltersExpanded = false;
        chips.forEach((chip, index) => { chip.hidden = hasOverflow && index >= visibleCount; });
      }

      const actionLabel = tagFiltersExpanded
        ? "收起标签筛选"
        : `展开全部 ${chips.length} 个标签筛选`;
      overflowButton.title = actionLabel;
      overflowButton.setAttribute("aria-label", actionLabel);
      overflowButton.setAttribute("aria-expanded", String(tagFiltersExpanded));
    }

    function renderTagFilters() {
      const bar = $("#tagFilterBar");
      const list = $("#tagFilterList");
      const overflowButton = $("#toggleTagFilterOverflow");
      const clearButton = $("#clearTagFilters");
      if (!bar || !list || !overflowButton || !clearButton) return;
      ensureTagCatalog();
      const available = getAvailableTagFilters();
      const availableKeys = new Set(available.map((definition) => definition.name.toLocaleLowerCase()));
      currentTagFilters = currentTagFilters.filter((name) => availableKeys.has(name.toLocaleLowerCase()));
      const activeKeys = new Set(currentTagFilters.map((name) => name.toLocaleLowerCase()));
      const orderedAvailable = available.slice().sort((a, b) => {
        const aActive = activeKeys.has(a.name.toLocaleLowerCase());
        const bActive = activeKeys.has(b.name.toLocaleLowerCase());
        if (aActive !== bActive) return aActive ? -1 : 1;
        return b.count - a.count || a.name.localeCompare(b.name);
      });

      bar.classList.toggle("empty", !available.length);
      if (!available.length) tagFiltersExpanded = false;
      bar.classList.toggle("expanded", Boolean(available.length && tagFiltersExpanded));
      overflowButton.hidden = true;
      clearButton.hidden = !currentTagFilters.length;
      list.innerHTML = orderedAvailable.map((definition) => {
        const active = activeKeys.has(definition.name.toLocaleLowerCase());
        return '<button class="tag-filter-chip' + (active ? " active" : "") +
          '" type="button" data-tag-filter="' + escapeHtml(definition.name) +
          '" style="' + tagStyleFromColorId(definition.color) +
          '" aria-pressed="' + active + '"><span>' + escapeHtml(definition.name) +
          '</span><span class="tag-filter-count">' + definition.count + "</span></button>";
      }).join("");
      renderIcons();
      requestAnimationFrame(layoutTagFilters);
    }

    function toggleTagFilter(name) {
      const definition = getTagDefinition(name);
      const key = definition.name.toLocaleLowerCase();
      const activeKeys = new Set(currentTagFilters.map((tag) => tag.toLocaleLowerCase()));

      saveState();
      renderTagFilters();
      renderList();

      renderIcons();
